<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14111f">
<title>朋友版 Hitster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one-screen phone app. Setup → round (song + buzz pads) → reveal/scoreboard */
:root{
  --ink:#14111f; --surface:#211b33; --line:#3a3152;
  --fg:#f4effc; --muted:#a399bd;
  --pink:#ff3d8b; --cyan:#2de2e6; --sun:#ffd23f; --lime:#9be564; --violet:#a98bff; --orange:#ff9f45;
  --display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font:15px/1.6 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
[hidden]{display:none!important}

.app{min-height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding-inline:16px;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.logo{font:800 22px/1 var(--display);letter-spacing:-.02em}
.logo b{color:var(--pink)}
.linkbtn{background:none;border:0;color:var(--muted);padding:6px 4px}

h2{font:800 19px/1.2 var(--display);margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font:500 13px var(--body);color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--pink)}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:700;background:var(--fg);color:var(--ink);min-height:50px}
.btn.pink{background:var(--pink);color:#fff}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.small{padding:7px 14px;min-height:38px;border-radius:10px;font-weight:500}
.btn:disabled{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:10px}
.input{flex:1;min-width:0;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.input:focus{border-color:var(--cyan);outline:none}
textarea.input{min-height:150px;resize:vertical;width:100%}

/* ---------- setup ---------- */
.setup{display:flex;flex-direction:column;gap:26px;padding-block:4px 20px}
.block{display:flex;flex-direction:column;gap:12px}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.list{position:relative;text-align:left;border:0;border-radius:16px;padding:14px;min-height:96px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:inset 0 0 0 2px transparent}
.list .n{font-weight:700;line-height:1.3}
.list .c{font-size:12px;color:var(--muted)}
.list[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--cyan)}
.list .mine{position:absolute;top:10px;right:10px;font-size:11px;color:var(--ink);background:var(--sun);border-radius:6px;padding:0 6px}
.list.add{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);align-items:center;justify-content:center;color:var(--muted);text-align:center}

.players{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;border-radius:999px;padding:4px 6px 4px 12px;background:var(--surface);font-weight:500}
.chip i{width:10px;height:10px;border-radius:50%;flex:none}
.chip button{border:0;background:var(--line);width:24px;height:24px;border-radius:50%;font-size:12px;line-height:1}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.opt select{flex:none;width:100%}

/* ---------- import sheet ---------- */
.sheet{position:fixed;inset:0;background:rgba(10,8,16,.7);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .panel{width:100%;max-width:720px;max-height:92%;overflow:auto;background:var(--ink);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -1px 0 var(--line)}

/* ---------- round ---------- */
.round{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;min-height:240px}
.big{font:800 clamp(28px,7.5vw,42px)/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance;margin:0}
.record{width:min(52vw,210px);aspect-ratio:1;max-width:100%;border-radius:50%;
  background:radial-gradient(circle,var(--pink) 0 14%,var(--ink) 14.5% 16%,transparent 16.5%),
  repeating-radial-gradient(circle,#0c0a13 0 2px,#1d1830 2px 4px);
  box-shadow:0 0 0 6px var(--surface),0 18px 50px -10px rgba(255,61,139,.35)}
.spin{animation:spin 1.8s linear infinite}
.paused .spin{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.timer{font:800 18px var(--display);font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{width:min(70vw,300px);height:6px;border-radius:3px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--cyan)}

.buzzed{font:800 clamp(30px,9vw,48px)/1.1 var(--display)}
.answer{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border-radius:18px;padding:14px;max-width:100%}
.answer img{width:84px;height:84px;border-radius:12px;flex:none;background:var(--line)}
.answer > div{min-width:0}
.answer .y{font:800 36px/1 var(--display);color:var(--sun);font-variant-numeric:tabular-nums}
.answer .t{font-weight:700;font-size:18px;line-height:1.3}

.pads{display:grid;gap:8px;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
.pad{border:0;border-radius:18px;min-height:clamp(70px,13vh,120px);font:800 20px var(--display);color:#14111f;background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;user-select:none;-webkit-user-select:none;transition:transform .08s,opacity .2s}
.pad:active{transform:scale(.97)}
.pad small{font:500 12px var(--body);opacity:.75}
.pad.out{opacity:.22}
.pad.win{outline:4px solid var(--fg);outline-offset:2px}

.board{display:flex;flex-direction:column;gap:6px;width:100%;max-width:420px}
.score{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:8px 14px;text-align:left}
.score i{width:12px;height:12px;border-radius:50%}
.score b{font:800 20px var(--display);font-variant-numeric:tabular-nums}
.score.lead{box-shadow:inset 0 0 0 2px var(--sun)}
.adj{display:flex;gap:4px}
.adj button{width:30px;height:30px;border-radius:8px;border:0;background:var(--line)}

/* ---------- motion ---------- */
.stage:not([hidden]){animation:enter .38s cubic-bezier(.2,.9,.25,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}}
.disc{position:relative;display:grid;place-items:center}
.disc::before,.disc::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--pink);animation:ripple 2.4s ease-out infinite;pointer-events:none}
.disc::after{animation-delay:1.2s;border-color:var(--cyan)}
.paused .disc::before,.paused .disc::after{animation-play-state:paused;opacity:0}
@keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(1.65);opacity:0}}
.bar i{transition:width .25s linear,background .3s}
.bar.hot i{background:var(--pink)}
.timer.hot{color:var(--pink);animation:tick 1s ease-in-out infinite}
@keyframes tick{50%{transform:scale(1.15)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:30;background:var(--flash,var(--pink));opacity:0}
.flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.slam{animation:slam .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(2.4) rotate(-6deg);opacity:0}}
.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.answer.flipin{animation:flipin .65s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes flipin{from{transform:perspective(700px) rotateY(-95deg);opacity:0}}
.answer.flipin .t,.answer.flipin .note{animation:enter .4s .5s both}
.pad.win{animation:lit .6s}
@keyframes lit{0%{transform:scale(1.08);filter:brightness(1.35)}}
.pad.pop small{display:inline-block;animation:pop .55s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{40%{transform:scale(2)}}
.pad.justout{animation:shake .4s}
.score{animation:enter .35s both;animation-delay:calc(var(--i,0) * 70ms)}
.btn{transition:transform .1s,opacity .2s}
.btn:active:not(:disabled){transform:scale(.96)}
.list{transition:transform .18s,box-shadow .2s}
.list[aria-pressed="true"]{transform:translateY(-3px)}
.sheet:not([hidden]) .panel{animation:sheetup .35s cubic-bezier(.2,.9,.25,1) both}
@keyframes sheetup{from{transform:translateY(100%)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:31}
.setup > .block:last-child{position:sticky;bottom:0;z-index:5;margin-top:-10px;padding:20px 0 calc(4px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--ink) 34%)}

/* ---------- modes ---------- */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{position:relative;overflow:hidden;text-align:left;border:0;border-radius:18px;padding:16px;min-height:112px;background:var(--surface);display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 2px transparent;transition:transform .3s cubic-bezier(.2,.9,.25,1),box-shadow .2s}
.mode b{position:relative;font:800 18px/1.2 var(--display)}
.mode span{position:relative;font-size:13px;color:var(--muted);line-height:1.45}
.mode::before{content:"";position:absolute;right:-34px;top:-34px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.13;transition:transform .6s cubic-bezier(.2,.9,.25,1),opacity .3s}
.mode[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--c);transform:translateY(-3px)}
.mode[aria-pressed="true"]::before{transform:scale(2.2);opacity:.2}
.mode:disabled{opacity:.45;cursor:default}
@media (max-width:540px){.modes{grid-template-columns:1fr}.mode{min-height:0}}

/* ---------- practice ---------- */
.practice{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.phud{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.clock{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:inline-block}
.clock.hot{color:var(--pink);animation:tick 1s ease-in-out infinite}
.tally{display:flex;align-items:baseline;gap:8px}
.count{font:800 34px/1 var(--display);color:var(--lime);font-variant-numeric:tabular-nums;display:inline-block}
.count.bump{animation:bump .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{40%{transform:scale(1.7)}}
.streak{align-self:center;font:700 13px/1.6 var(--body);color:var(--ink);background:var(--sun);border-radius:999px;padding:1px 10px}
.streak.on{animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
.tbar{height:8px;border-radius:4px;background:var(--surface);overflow:hidden}
.tbar i{display:block;height:100%;transform-origin:left;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink),var(--cyan));background-size:300% 100%;animation:flow 4s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.practice.done .phud,.practice.done .tbar{display:none}

.pstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;min-height:320px}
.cd{font:800 clamp(120px,38vw,200px)/1 var(--display);letter-spacing:-.04em}
.cd.word{font-size:clamp(56px,16vw,96px);color:var(--sun)}
.cd.go{animation:cdin .75s cubic-bezier(.2,.9,.25,1) both}
@keyframes cdin{0%{transform:scale(2.6);opacity:0;filter:blur(8px)}30%{transform:scale(1);opacity:1;filter:blur(0)}80%{transform:scale(.92);opacity:1}100%{transform:scale(.7);opacity:0}}

.orbwrap{position:relative;width:min(60vw,260px);aspect-ratio:1;display:grid;place-items:center;margin:32px 0}
.orbwrap.in{animation:orbin .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes orbin{from{transform:scale(.55);opacity:0}}
.orbwrap.out{animation:orbout .28s cubic-bezier(.5,0,.75,0) both}
@keyframes orbout{to{transform:translateX(-45%) scale(.7) rotate(-8deg);opacity:0}}
.viz{position:absolute;left:-30%;top:-30%;width:160%;height:160%;pointer-events:none}
.prog{position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(var(--fg) calc(var(--p,0) * 1turn),rgba(255,255,255,.08) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.orb{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;border:0;color:#fff;
  background:radial-gradient(circle at 34% 28%,#ff8cbb 0,var(--pink) 42%,#a3268c 100%);
  box-shadow:0 24px 70px -14px rgba(255,61,139,.65),inset 0 -14px 34px rgba(40,0,40,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;user-select:none;-webkit-user-select:none;
  animation:breathe 1.8s ease-in-out infinite;transition:transform .12s}
@keyframes breathe{50%{transform:scale(1.035)}}
.orb:active{transform:scale(.93);animation-play-state:paused}
.orbwrap .record{position:relative;z-index:1;width:100%;max-width:none}
.orb b{font:800 clamp(24px,6.5vw,32px)/1.1 var(--display)}
.orb small{font-size:13px;opacity:.85}

.card{width:min(100%,380px);background:var(--surface);border-radius:24px;padding:18px 18px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 30px 60px -24px rgba(0,0,0,.7)}
.card img{width:min(44vw,176px);aspect-ratio:1;border-radius:16px;background:var(--line);box-shadow:0 16px 36px -14px rgba(0,0,0,.8)}
.card .y{font:800 40px/1 var(--display);color:var(--sun);font-variant-numeric:tabular-nums}
.card .t{font:800 22px/1.25 var(--display);text-wrap:balance}
.card .rt{margin:0;font-weight:700;font-size:13px;color:var(--cyan)}
.card .ask{margin-top:4px}
.card.morph{animation:morph .6s cubic-bezier(.2,.9,.25,1.12) both}
@keyframes morph{from{transform:scale(.3);border-radius:50%;opacity:0;filter:blur(6px)}55%{opacity:1;filter:blur(0)}}
.card.goR{animation:goR .4s cubic-bezier(.5,0,.75,0) both}
@keyframes goR{to{transform:translateX(130%) rotate(16deg);opacity:0}}
.card.goL{animation:goL .4s cubic-bezier(.5,0,.75,0) both}
@keyframes goL{20%{transform:translateX(12px)}to{transform:translate(-40%,60%) rotate(-12deg) scale(.8);opacity:0}}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,380px)}
.jbtn{min-height:64px;border:0;border-radius:18px;font:800 19px var(--display);transition:transform .1s}
.jbtn:active{transform:scale(.95)}
.jbtn.ok{background:var(--lime);color:var(--ink)}
.jbtn.no{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.kbd{display:none;margin-left:8px;font:500 12px var(--body);opacity:.6;border:1px solid currentColor;border-radius:5px;padding:0 5px;vertical-align:2px}
@media (hover:hover) and (pointer:fine){.kbd{display:inline-block}}

.plast{min-height:50px;display:flex;justify-content:center}
.ptoast{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:6px 14px 6px 6px;max-width:100%;font-size:13px}
.ptoast img{width:38px;height:38px;border-radius:8px;flex:none;background:var(--line)}
.ptoast .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptoast.in{animation:toastin .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes toastin{from{transform:translateY(16px) scale(.9);opacity:0}}
.m{font-weight:900;flex:none}
.m.right{color:var(--lime)} .m.wrong{color:var(--pink)} .m.skip,.m.timeout{color:var(--muted);font-weight:500}

.result{justify-content:flex-start;gap:16px;padding-top:8px}
.res-n{font:800 clamp(96px,30vw,150px)/.9 var(--display);color:var(--lime);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.res-l{margin:0;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.pb{display:inline-block;background:var(--sun);color:var(--ink);font-weight:900;border-radius:8px;padding:2px 10px;transform:rotate(-6deg)}
.pb.stamp{animation:stamp .55s .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(3) rotate(-24deg);opacity:0}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:420px}
.stat{background:var(--surface);border-radius:14px;padding:10px 6px;animation:enter .4s both;animation-delay:calc(.6s + var(--i) * 90ms)}
.stat b{display:block;font:800 22px/1.2 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;width:100%;max-width:420px;display:flex;flex-direction:column;gap:6px}
.hist li{display:grid;grid-template-columns:44px 40px minmax(0,1fr) 36px;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:6px;text-align:left;animation:enter .35s both;animation-delay:calc(1s + var(--i) * 45ms)}
.hist .m{text-align:center;font-size:13px}
.hist img{width:40px;height:40px;border-radius:8px;background:var(--line)}
.hist .nm{min-width:0;display:flex;flex-direction:column;line-height:1.35}
.hist .nm b,.hist .nm small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .nm small{color:var(--muted)}
.hist button{border:0;background:var(--line);border-radius:10px;width:36px;height:36px;font-size:12px}
.hist button.on{background:var(--cyan);color:var(--ink)}

.shock{position:fixed;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:3px solid var(--c);pointer-events:none;z-index:28;animation:shock .75s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes shock{from{transform:scale(.3);opacity:1}to{transform:scale(6);opacity:0;border-width:1px}}
.float{position:fixed;z-index:32;font:800 24px var(--display);color:var(--lime);pointer-events:none;animation:floatup .9s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes floatup{from{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-12px) scale(1.25)}to{transform:translate(-50%,-64px) scale(1);opacity:0}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:27;box-shadow:inset 0 0 0 0 rgba(255,61,139,0)}
#vig.on{animation:heart 1s ease-in-out infinite}
@keyframes heart{0%,100%{box-shadow:inset 0 0 90px 0 rgba(255,61,139,.12)}15%{box-shadow:inset 0 0 120px 24px rgba(255,61,139,.42)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">HIT<b>STER</b> 搶答</div>
    <button id="quitBtn" class="linkbtn" hidden>結束這局</button>
  </header>

  <!-- ================= SETUP ================= -->
  <section id="setup" class="setup">
    <div class="block">
      <h2>怎麼玩</h2>
      <div id="modes" class="modes">
        <button class="mode" data-mode="practice" style="--c:var(--cyan)"><b>單人練習</b><span>限時內猜對越多首越好，自己判對錯</span></button>
        <button class="mode" data-mode="party" style="--c:var(--pink)"><b>同機搶答</b><span>一支手機放桌上，2～6 人各按一個鈕</span></button>
        <button class="mode" data-mode="online" style="--c:var(--violet)" disabled><b>手機連線</b><span>一台當螢幕，大家用自己的手機搶答（製作中）</span></button>
      </div>
    </div>

    <div class="block">
      <h2>選歌單 <small>可以複選</small></h2>
      <div id="lists" class="lists"></div>
    </div>

    <div class="block" id="playersBlock">
      <h2>玩家 <small>每人一個搶答鈕，最多 6 人</small></h2>

<script src="songs-data.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- built-in playlists: looked up ahead of time by build-songs.js ---------- */
const DATA = window.SONG_DATA || { lists: [] };
const BUILTIN = DATA.lists.filter(l => l.songs && l.songs.length);
const linesOf = txt => txt.split(/\r?\n/).map(s => s.replace(/^\s*\d+[.、)）]\s*/, "").replace(/[,，\t;]+/g, " ").trim()).filter(Boolean);
let custom = store.get("hitsterLists", []);
let selected = new Set(store.get("hitsterSel", []));
const countOf = l => Array.isArray(l.songs) ? l.songs.length : linesOf(l.songs).length;
let players = store.get("hitsterPlayers", ["玩家 1", "玩家 2"]);
const COLORS = ["--pink","--cyan","--sun","--lime","--violet","--orange"];
const colorOf = i => `var(${COLORS[i % COLORS.length]})`;

/* ---------- song lookup: Apple Music first, Deezer as backup ---------- */
let cbN = 0;
function jsonp(url, param = "callback"){
  return new Promise((res, rej) => {
    const name = "hcb" + (++cbN) + "x" + Math.floor(Math.random() * 1e6);
    const s = document.createElement("script");
    const t = setTimeout(() => { cleanup(); rej(new Error("timeout")); }, 9000);
    function cleanup(){ clearTimeout(t); delete window[name]; s.remove(); }
    window[name] = d => { cleanup(); res(d); };
    s.onerror = () => { cleanup(); rej(new Error("script")); };
    s.src = url + (url.includes("?") ? "&" : "?") + param + "=" + name;
    document.head.appendChild(s);
  });
}
async function getJSON(url, jsonpUrl){
  try { return await jsonp(jsonpUrl || url); }
  catch { const r = await fetch(url); if (!r.ok) throw new Error("http " + r.status); return await r.json(); }
}
const norm = s => (s || "").toLowerCase().replace(/[\(\[（【].*?[\)\]）】]/g, "").replace(/\s*-\s*(remaster|live|single|version).*$/i, "").replace(/[^\p{L}\p{N}]/gu, "");

/* Apple */
async function appleSearch(line){
  let m = line.match(/music\.apple\.com\/([a-z]{2})\/.*?(?:[?&]i=|\/song\/[^/]+\/)(\d+)/i);
  if (m) {
    const d = await getJSON(`https://itunes.apple.com/lookup?id=${m[2]}&country=${m[1]}&entity=song`);
    return (d.results || []).find(r => r.previewUrl) || null;
  }
  const d = await getJSON(`https://itunes.apple.com/search?term=${encodeURIComponent(line)}&country=TW&media=music&entity=song&limit=10`);
  const res = (d.results || []).filter(r => r.previewUrl);
  if (!res.length) return null;
  // same song, earliest release → avoids remasters / compilations giving a late year
  const key = norm(res[0].trackName), artist = res[0].artistName;
  const same = res.filter(r => norm(r.trackName) === key && r.artistName === artist && r.releaseDate);
  same.sort((a, b) => a.releaseDate.localeCompare(b.releaseDate));
  return same[0] || res[0];
}

/* Deezer */
const dz = path => { const u = `https://api.deezer.com/${path}`; return getJSON(u, u + (u.includes("?") ? "&" : "?") + "output=jsonp"); };
async function deezerSearch(line){
  if (/music\.apple\.com/i.test(line)) return null;
  const d = await dz(`search?q=${encodeURIComponent(line)}&limit=10`);
  if (d && d.error) throw new Error("deezer");
  const res = (d.data || []).filter(r => r.preview);
  if (!res.length) return null;
  const key = norm(res[0].title), artist = res[0].artist && res[0].artist.name;
  const pick = res.find(r => norm(r.title) === key && r.artist && r.artist.name === artist) || res[0];
  let date = "";
  try { const al = await dz(`album/${pick.album.id}`); date = al.release_date || ""; } catch {}
  return {
    trackName: pick.title, artistName: pick.artist ? pick.artist.name : "",
    releaseDate: date && date !== "0000-00-00" ? date : "",
    previewUrl: pick.preview, artworkUrl100: pick.album ? (pick.album.cover_medium || "") : "", source: "Deezer"
  };
}

let appleDown = false, deezerDown = false;
async function resolve(line){
  if (!appleDown) {
    try { return await appleSearch(line); }
    catch { appleDown = true; console.warn("Apple Music 連不上，改用 Deezer"); }
  }
  if (!deezerDown) {
    try { return await deezerSearch(line); }
    catch { deezerDown = true; }
  }
  const hint = location.protocol.startsWith("http") && window.top === window.self
    ? "Apple Music 和 Deezer 都連不上。請確認網路正常，並關閉廣告封鎖外掛、Brave 防護或 VPN 後再試。"
    : "目前是在預覽視窗或本機檔案中開啟，請改用 GitHub Pages 的網址打開。";
  appleDown = deezerDown = false;   // let "再試一次" try both again
  const e = new Error(hint); e.network = true; throw e;
}

/* ================= SETUP ================= */
function allLists(){ return [...BUILTIN, ...custom]; }
if (!BUILTIN.length) $("#setupMsg").textContent = "還沒有內建歌單資料（songs-data.js）。請到 GitHub 的 Actions 分頁確認「更新歌單並發布網站」已經跑完。";
if (![...selected].some(id => [...BUILTIN, ...custom].some(l => l.id === id)) && BUILTIN[0]) selected.add(BUILTIN[0].id);
function renderLists(){
  $("#lists").innerHTML = allLists().map(l => {
    const n = countOf(l), mine = l.id.startsWith("c-");
    return `<button class="list" data-id="${l.id}" aria-pressed="${selected.has(l.id)}">
      ${mine ? `<span class="mine">自訂</span>` : ""}
      <span class="n">${esc(l.name)}</span><span class="c">${n} 首${mine ? " · 長按編輯" : ""}</span></button>`;
  }).join("") + `<button class="list add" id="addList">＋ 匯入自己的歌單</button>`;
}
let pressT = null, longPressed = false;
$("#lists").addEventListener("pointerdown", e => {
  const b = e.target.closest(".list[data-id^='c-']"); if (!b) return;
  longPressed = false;
  pressT = setTimeout(() => { longPressed = true; openSheet(b.dataset.id); }, 550);
});
["pointerup","pointerleave","pointercancel"].forEach(t => $("#lists").addEventListener(t, () => clearTimeout(pressT)));
$("#lists").addEventListener("contextmenu", e => { if (e.target.closest(".list[data-id^='c-']")) e.preventDefault(); });
$("#lists").addEventListener("click", e => {
  if (e.target.closest("#addList")) return openSheet(null);
  const b = e.target.closest(".list[data-id]"); if (!b || longPressed) return;
  const id = b.dataset.id;
  selected.has(id) ? selected.delete(id) : selected.add(id);
  haptic("tap");
  store.set("hitsterSel", [...selected]); renderLists();
});

/* import sheet */
let editing = null;
function openSheet(id){
  editing = id;
  const l = custom.find(c => c.id === id);
  $("#sheetTitle").textContent = l ? "編輯歌單" : "匯入歌單";
  $("#impName").value = l ? l.name : "";
  $("#impText").value = l ? l.songs : "";
  $("#impDelete").hidden = !l;
  $("#impDelete").textContent = "刪除這份歌單";
  $("#sheet").hidden = false;
}
$("#impCancel").onclick = () => $("#sheet").hidden = true;
$("#sheet").onclick = e => { if (e.target.id === "sheet") $("#sheet").hidden = true; };
$("#impFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const t = await f.text();
  $("#impText").value = ($("#impText").value.trim() + "\n" + t).trim();
  if (!$("#impName").value) $("#impName").value = f.name.replace(/\.\w+$/, "");
  e.target.value = "";
};
$("#impSave").onclick = () => {
  const songs = linesOf($("#impText").value).join("\n");
  if (!songs) { $("#impText").focus(); return; }
  const name = $("#impName").value.trim() || `我的歌單 ${custom.length + 1}`;
  if (editing) Object.assign(custom.find(c => c.id === editing), { name, songs });
  else { const id = "c-" + Date.now(); custom.push({ id, name, songs }); selected.add(id); }
  store.set("hitsterLists", custom); store.set("hitsterSel", [...selected]);
  $("#sheet").hidden = true; renderLists();
};
$("#impDelete").onclick = () => {
  const b = $("#impDelete");
  if (b.textContent !== "確定刪除？") { b.textContent = "確定刪除？"; return; }
  custom = custom.filter(c => c.id !== editing); selected.delete(editing);
  store.set("hitsterLists", custom); store.set("hitsterSel", [...selected]);
  $("#sheet").hidden = true; renderLists();
};

/* players */
function renderPlayers(){
  $("#players").innerHTML = players.length
    ? players.map((p, i) => `<span class="chip"><i style="background:${colorOf(i)}"></i>${esc(p)}<button data-rm="${i}" aria-label="移除 ${esc(p)}">✕</button></span>`).join("")
    : `<span class="note">沒有玩家也能玩：只播歌、看答案，不計分。</span>`;
  $("#addPlayer").disabled = players.length >= 6;
  store.set("hitsterPlayers", players);
}
$("#players").onclick = e => { const b = e.target.closest("[data-rm]"); if (b) { players.splice(+b.dataset.rm, 1); renderPlayers(); } };
function addPlayer(){
  const v = $("#newPlayer").value.trim();
  if (!v || players.length >= 6) return;
  players.push(v); $("#newPlayer").value = ""; renderPlayers();
}
$("#addPlayer").onclick = addPlayer;
$("#newPlayer").addEventListener("keydown", e => { if (e.key === "Enter") addPlayer(); });

/* ================= HAPTICS ================= */
// Android: Vibration API with patterns. iPhone (iOS 18+): toggling a hidden switch gives a light tap.
const hapticLabel = (() => {
  const l = document.createElement("label"), i = document.createElement("input");
  i.type = "checkbox"; i.setAttribute("switch", ""); i.tabIndex = -1;
  l.setAttribute("aria-hidden", "true"); l.style.display = "none";
  l.appendChild(i); document.body.appendChild(l); return l;
})();
const canVibrate = typeof navigator.vibrate === "function";
const HAPTIC = {
  tap:     [15],
  start:   [30],
  buzz:    [180],
  wrong:   [70, 60, 70],
  right:   [40, 40, 40, 40, 120],
  tick:    [25],
  win:     [100, 60, 100, 60, 300]
};
function haptic(kind){
  const pat = HAPTIC[kind] || [20];
  if (canVibrate) { try { navigator.vibrate(pat); } catch {} return; }
  // iOS: one light tap per pulse in the pattern
  let t = 0;
  pat.forEach((ms, k) => {
    if (k % 2 === 0) setTimeout(() => { try { hapticLabel.click(); } catch {} }, t);
    t += ms;
  });
}

/* ================= MOTION ================= */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const hexOf = i => getComputedStyle(document.documentElement).getPropertyValue(COLORS[i % COLORS.length]).trim();
function restart(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function flash(i){ const f = $("#flashEl"); f.style.setProperty("--flash", hexOf(i)); restart(f, "go"); }
function rollYear(el, y){
  const t = +y;
  if (!t || reduce) { el.textContent = y; return; }
  const from = t - 35, dur = 1000, t0 = performance.now();
  (function f(now){
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (t - from) * e);
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}
const fx = $("#fx"), fctx = fx.getContext("2d");
let parts = [], fxOn = false;
function confetti(colors, n = 110, ox = .5, oy = .42){
  if (reduce) return;
  const dpr = devicePixelRatio || 1;
  fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (let k = 0; k < n; k++) parts.push({
    x: innerWidth * ox + (Math.random() - .5) * 60, y: innerHeight * oy,
    vx: (Math.random() - .5) * 15, vy: -Math.random() * 13 - 5,
    w: Math.random() * 7 + 5, h: Math.random() * 4 + 3, c: colors[k % colors.length],
    a: Math.random() * 6, va: (Math.random() - .5) * .45, life: 0
  });
  if (!fxOn) { fxOn = true; requestAnimationFrame(stepFx); }
}
function stepFx(){
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.y < innerHeight + 30 && p.life < 260);
  for (const p of parts) {
    p.vy += .42; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life++;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.a);
    fctx.fillStyle = p.c; fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.a * 1.7)) + 1);
    fctx.restore();
  }
  if (parts.length) requestAnimationFrame(stepFx); else { fxOn = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* ================= GAME ================= */
const player = $("#player");
let G = null;
const VIEWS = ["vReady","vPlay","vBuzz","vReveal"];
const show = v => { VIEWS.forEach(x => $("#" + x).hidden = x !== v); if (!P) $("#vig").classList.remove("on"); };

function silentWav(){
  const n = 800, b = new ArrayBuffer(44 + n), v = new DataView(b);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0,"RIFF"); v.setUint32(4,36+n,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,"data"); v.setUint32(40,n,true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([b], { type:"audio/wav" }));
}
let wakeLock = null;
async function keepAwake(){ try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => { if ((G || P) && document.visibilityState === "visible") keepAwake(); });

function buildItems(){
  const seen = new Set(), items = [];
  allLists().filter(l => selected.has(l.id)).forEach(l => {
    if (Array.isArray(l.songs)) l.songs.forEach(x => {
      const k = x.k || x.u; if (seen.has(k)) return; seen.add(k);
      items.push({ ready: { trackName: x.title || x.t, artistName: x.artist || x.a, releaseDate: x.y ? String(x.y) : "", previewUrl: x.u, artworkUrl100: x.art } });
    });
    else linesOf(l.songs).forEach(line => {
      const k = "q:" + line.toLowerCase(); if (seen.has(k)) return; seen.add(k);
      items.push({ line });
    });
  });
  return items;
}

$("#startBtn").onclick = async () => {
  const items = buildItems();
  if (!items.length) { $("#setupMsg").textContent = "請至少選一份歌單。"; return; }
  $("#setupMsg").textContent = "";
  const lines = items;
  try { player.src = silentWav(); await player.play(); player.pause(); } catch {}
  keepAwake();
  if (mode === "practice") return startPractice(items);
  requestAnimationFrame(gFrame);
  G = {
    queue: shuffle(lines), total: lines.length, n: 0, next: null, cur: null,
    scores: players.map(() => 0), locked: new Set(), buzzer: -1,
    guess: $("#optGuess").value, wrong: $("#optWrong").value, win: +$("#optWin").value, over: false
  };
  $("#setup").hidden = true; $("#round").hidden = false; $("#quitBtn").hidden = false;
  $("#hudGuess").textContent = "猜" + G.guess;
  renderPads();
  show("vReady");
  $("#readyMsg").textContent = "準備好了嗎？";
  prepareNext();
};

async function prepareNext(){
  G.next = null;
  $("#playBtn").disabled = true; $("#nextBtn").disabled = true;
  $("#playBtn").textContent = $("#nextBtn").textContent = "找歌中…";
  while (G && G.queue.length) {
    const line = G.queue.shift();
    try {
      const r = line.ready || await resolve(line.line);
      if (r) { G.next = r; break; }
    } catch (e) {
      if (e.network) { G.queue.unshift(line); $("#readyMsg").textContent = e.message; $("#readyMsg").classList.add("err"); show("vReady");
        $("#playBtn").disabled = false; $("#playBtn").textContent = "再試一次"; $("#playBtn").onclick = () => { $("#readyMsg").classList.remove("err"); $("#playBtn").onclick = playNext; prepareNext(); }; return; }
    }
  }
  if (!G) return;
  $("#playBtn").onclick = playNext;
  if (G.over) { $("#playBtn").disabled = $("#nextBtn").disabled = false; $("#nextBtn").textContent = "看最後結果"; return; }
  $("#playBtn").disabled = $("#nextBtn").disabled = false;
  $("#playBtn").textContent = $("#nextBtn").textContent = G.next ? "播放下一首" : "看最後結果";
}

function playNext(){
  haptic("start");
  if (!G.next) return finish();
  G.cur = G.next; G.n++;
  G.locked = new Set(); G.buzzer = -1;
  $("#hudRound").textContent = `第 ${G.n} 首`;
  player.src = G.cur.previewUrl;
  player.currentTime = 0;
  player.play().catch(() => {});
  show("vPlay");
  renderPads();
  prepareNext();
}
$("#nextBtn").onclick = () => playNext();
$("#replayBtn").onclick = () => { player.currentTime = 0; player.play().catch(()=>{}); };
$("#revealBtn").onclick = () => reveal(-1);

player.addEventListener("timeupdate", () => {
  if (!G || !G.cur) return;
  const d = isFinite(player.duration) && player.duration > 0 ? player.duration : 30;
  $("#timer").textContent = `0:${String(Math.max(0, Math.ceil(d - player.currentTime))).padStart(2, "0")}`;
  $("#barFill").style.width = Math.min(100, player.currentTime / d * 100) + "%";
  const hot = !player.paused && d - player.currentTime <= 5;
  const sec = Math.ceil(d - player.currentTime);
  if (hot && sec !== G.lastTick) { G.lastTick = sec; haptic("tick"); }
  $("#bar").classList.toggle("hot", hot); $("#timer").classList.toggle("hot", hot);
  $("#prog2").style.setProperty("--p", Math.min(1, player.currentTime / d));
  if (!P) $("#vig").classList.toggle("on", hot && !$("#vPlay").hidden);
});
player.addEventListener("play", () => $("#vPlay").classList.remove("paused"));
player.addEventListener("pause", () => $("#vPlay").classList.add("paused"));
player.addEventListener("ended", () => { if (G && !$("#vPlay").hidden) $("#timer").textContent = "時間到，可以按重聽或看答案"; });

/* buzz pads */
function renderPads(){
  const pads = $("#pads");
  if (!players.length) { pads.innerHTML = ""; return; }
  pads.style.setProperty("--cols", players.length <= 2 ? players.length : players.length <= 4 ? 2 : 3);
  pads.innerHTML = players.map((p, i) =>
    `<button class="pad ${G.locked.has(i) ? "out" : ""} ${G.buzzer === i ? "win" : ""} ${G.pop === i ? "pop" : ""} ${G.justOut === i ? "justout" : ""}" data-p="${i}" style="--c:${colorOf(i)}">
      ${esc(p)}<small>${G.scores[i]} 分</small></button>`).join("");
  G.pop = G.justOut = -1;
}
$("#pads").addEventListener("pointerdown", e => {
  const b = e.target.closest(".pad"); if (!b || !G) return;
  e.preventDefault();
  const i = +b.dataset.p;
  if ($("#vPlay").hidden || G.locked.has(i) || G.buzzer >= 0) return;
  G.buzzer = i;
  player.pause();
  haptic("buzz");
  $("#buzzName").textContent = `${players[i]} 搶答！`;
  $("#buzzName").style.color = colorOf(i);
  $("#buzzHint").textContent = `請說出${G.guess}`;
  show("vBuzz"); renderPads();
  flash(i); restart($("#buzzName"), "slam"); shockAt(b, hexOf(i)); shockAt(b, "#f4effc");
});
$("#rightBtn").onclick = () => { const i = G.buzzer; if (i < 0) return; G.scores[i]++; G.pop = i; haptic("right"); { const pd = $(`.pad[data-p="${i}"]`); if (pd) floatAt(pd, "+1"); } reveal(i); confetti([hexOf(i), "#f4effc", hexOf(i + 2)]); };
$("#wrongBtn").onclick = () => {
  const i = G.buzzer; if (i < 0 || G.judging) return;
  G.judging = true;
  restart($("#buzzName"), "shake");
  haptic("wrong");
  setTimeout(() => { G.judging = false; wrongDone(i); }, 450);
};
function wrongDone(i){
  if (!G) return;
  G.buzzer = -1; G.justOut = i;
  if (G.wrong === "lock") G.locked.add(i); else G.scores[i]--;
  if (G.locked.size >= players.length) return reveal(-1);
  show("vPlay"); renderPads();
  player.play().catch(() => {});
}

function reveal(winner){
  const r = G.cur;
  const y = r.releaseDate ? r.releaseDate.slice(0, 4) : "?";
  $("#revealHead").textContent = winner >= 0 ? `${players[winner]} 答對，+1 分` : "答案是";
  $("#revealHead").style.color = winner >= 0 ? colorOf(winner) : "";
  $("#answer").className = "card";
  $("#answer").innerHTML = `<img alt="" src="${art(r, 300)}"><div class="y">${esc(y)}</div><div class="t">${esc(r.trackName)}</div><div class="note">${esc(r.artistName)}</div>`;
  restart($("#answer"), "morph");
  rollYear($("#answer .y"), y);
  renderBoard();
  G.buzzer = -1; G.locked = new Set(players.map((_, i) => i));
  renderPads();
  show("vReveal");
  if (!player.paused && winner >= 0) player.pause();
  const champ = G.win ? G.scores.findIndex(s => s >= G.win) : -1;
  if (champ >= 0) { G.over = true; $("#nextBtn").textContent = "看最後結果"; $("#nextBtn").onclick = finish; }
}
function renderBoard(final){
  if (!players.length) { $("#board").innerHTML = ""; return; }
  const max = Math.max(...G.scores);
  const order = players.map((p, i) => i).sort((a, b) => G.scores[b] - G.scores[a]);
  $("#board").innerHTML = order.map((i, k) => `<div class="score ${G.scores[i] === max && max > 0 ? "lead" : ""}" style="--i:${k}">
    <i style="background:${colorOf(i)}"></i><span>${esc(players[i])}</span>
    <span class="adj">${final ? "" : `<button data-adj="${i}" data-d="-1" aria-label="${esc(players[i])} 減 1 分">−</button><button data-adj="${i}" data-d="1" aria-label="${esc(players[i])} 加 1 分">＋</button>`}<b>${G.scores[i]}</b></span></div>`).join("");
}
$("#board").onclick = e => {
  const b = e.target.closest("[data-adj]"); if (!b) return;
  G.scores[+b.dataset.adj] += +b.dataset.d; renderBoard(); renderPads();
};
function finish(){
  player.pause();
  show("vReveal");
  const max = players.length ? Math.max(...G.scores) : 0;
  const winners = players.filter((_, i) => G.scores[i] === max);
  $("#revealHead").textContent = "";
  $("#answer").className = "answer";
  $("#answer").innerHTML = `<div style="text-align:center;width:100%"><div class="big">${players.length ? (max > 0 ? esc(winners.join("、")) + " 獲勝！" : "平手！") : "歌單播完了！"}</div>
    <div class="note">總共播了 ${G.n} 首</div></div>`;
  renderBoard(true);
  $("#pads").innerHTML = "";
  restart($("#answer"), "flipin");
  const all = players.length ? players.map((_, i) => hexOf(i)) : COLORS.map((_, i) => hexOf(i));
  haptic("win");
  [[.25,.5],[.75,.5],[.5,.35]].forEach(([x, y], k) => setTimeout(() => confetti(all, 90, x, y), k * 350));
  $("#nextBtn").disabled = false;
  $("#nextBtn").textContent = "回到設定";
  $("#nextBtn").onclick = quit;
}
function quit(){
  player.pause(); G = null;
  try { wakeLock && wakeLock.release(); } catch {}
  $("#round").hidden = true; $("#setup").hidden = false; $("#quitBtn").hidden = true;
  $("#quitBtn").textContent = "結束這局";
  $("#nextBtn").onclick = () => playNext();
}
$("#quitBtn").onclick = () => {
  const b = $("#quitBtn"), label = P ? "結束挑戰" : "結束這局";
  if (b.textContent !== "確定結束？") { b.textContent = "確定結束？"; setTimeout(() => { if (b.textContent === "確定結束？") b.textContent = label; }, 2500); return; }
  if (P) return P.phase === "count" ? pQuit() : pEnd("提前結束");
  finish();
};

/* ================= PRACTICE: timed solo challenge ================= */
// Flow: 3-2-1 → song plays under the orb → tap "我知道了" → answer card (song keeps playing) → self-judge → next.
// Clock keeps running the whole time; when it hits zero mid-judge you finish judging that song, then results.
let P = null;
const PV = ["pCd", "pPlay", "pJudge", "pResult"];
const pShow = v => PV.forEach(x => $("#" + x).hidden = x !== v);
const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const fine = matchMedia("(hover:hover) and (pointer:fine)").matches;
const ORB_SUB = fine ? "或按空白鍵" : "聽出來就按";
const MK = { right: "答對", wrong: "答錯", skip: "跳過", timeout: "沒聽出" };
const art = (r, n) => esc((r.artworkUrl100 || "").replace("100x100", `${n}x${n}`));

function shockAt(el, color){
  if (reduce || !el) return;
  const b = el.getBoundingClientRect(), d = document.createElement("div");
  d.className = "shock"; d.style.left = b.left + b.width / 2 + "px"; d.style.top = b.top + b.height / 2 + "px"; d.style.setProperty("--c", color);
  d.addEventListener("animationend", () => d.remove()); document.body.appendChild(d);
}
function floatAt(el, text){
  if (reduce) return;
  const b = el.getBoundingClientRect(), d = document.createElement("div");
  d.className = "float"; d.textContent = text; d.style.left = b.left + b.width / 2 + "px"; d.style.top = b.top - 6 + "px";
  d.addEventListener("animationend", () => d.remove()); document.body.appendChild(d);
}
function countUp(el, n){
  if (reduce || !n) { el.textContent = n; return; }
  const t0 = performance.now(), dur = 900;
  (function f(now){ const p = Math.min(1, (now - t0) / dur); el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f); })(t0);
}

function startPractice(items){
  P = { items, queue: shuffle(items), durS: +$("#optDur").value, guess: $("#optGuess").value,
        log: [], streak: 0, best: 0, phase: "count", endAt: 0, cur: null, t0: 0, started: false, timeUp: false };
  P.nextP = pFetch();
  $("#setup").hidden = true; $("#practice").hidden = false; $("#practice").classList.remove("done");
  $("#quitBtn").hidden = false; $("#quitBtn").textContent = "結束挑戰";
  $("#pCount").textContent = "0"; $("#pStreak").hidden = true; $("#pLast").innerHTML = "";
  $("#pClock").textContent = fmt(P.durS * 1000); $("#pClock").classList.remove("hot"); $("#pBar").style.transform = "";
  pShow("pCd");
  requestAnimationFrame(pFrame);
  const seq = ["3", "2", "1", "開始！"]; let k = 0;
  const me = P;
  (function step(){
    if (P !== me || P.phase !== "count") return;
    if (k === seq.length) { P.endAt = performance.now() + P.durS * 1000; return pPlayNext(); }
    const el = $("#cdNum"); el.textContent = seq[k]; el.classList.toggle("word", k === 3); restart(el, "go");
    haptic(k === 3 ? "start" : "tick"); shockAt(el, hexOf(k === 3 ? 2 : k));
    k++; setTimeout(step, k === seq.length ? 550 : 750);
  })();
}

async function pFetch(){
  const me = P;
  while (P === me && me.queue.length) {
    const it = me.queue.shift();
    if (it.ready) return it.ready;
    try { const r = await resolve(it.line); if (r) return r; }
    catch (e) { if (e.network) throw e; }
  }
  return null;
}

async function pPlayNext(){
  if (!P) return;
  if (P.timeUp) return pEnd("時間到！");
  P.phase = "load";
  const me = P;
  let r;
  try { r = await P.nextP; } catch (e) { return pEnd(e.message); }
  if (P !== me || P.phase !== "load") return;
  if (!r) return pEnd("歌單裡的歌都聽完了！");
  P.cur = r; P.started = false; P.needTap = false; P.nextP = pFetch();
  player.src = r.previewUrl; player.currentTime = 0;
  P.phase = "play";
  $("#orbLabel").textContent = "我知道了！"; $("#orbSub").textContent = ORB_SUB; $("#prog").style.setProperty("--p", 0);
  $("#orbwrap").classList.remove("out");
  pShow("pPlay"); restart($("#orbwrap"), "in");
  player.play().catch(() => {
    if (P === me && P.phase === "play") { P.needTap = true; $("#orbLabel").textContent = "點我播放"; $("#orbSub").textContent = "瀏覽器暫停了自動播放"; }
  });
}
player.addEventListener("playing", () => { if (P && P.phase === "play" && !P.started) { P.started = true; P.t0 = performance.now(); } });
player.addEventListener("ended", () => { if (P && P.phase === "play") pSkip("timeout"); });
player.addEventListener("error", () => { if (P && P.phase === "play" && player.src !== "" && !player.src.startsWith("blob:")) pPlayNext(); });

function pKnow(){
  if (!P || P.phase !== "play") return;
  if (P.needTap) {
    P.needTap = false; player.play().catch(() => {});
    $("#orbLabel").textContent = "我知道了！"; $("#orbSub").textContent = ORB_SUB; return;
  }
  P.curT = P.started ? (performance.now() - P.t0) / 1000 : 0;
  P.phase = "judge";
  player.pause();   // no audio after buzzing, so nobody can confirm the answer by listening
  haptic("buzz"); shockAt($("#orb"), hexOf(0)); shockAt($("#orb"), hexOf(1));
  const r = P.cur, y = r.releaseDate ? r.releaseDate.slice(0, 4) : "?";
  $("#pCard").innerHTML = `<p class="rt">${P.curT ? P.curT.toFixed(1) + " 秒就聽出來" : "聽出來了"}</p>
    <img alt="" src="${art(r, 300)}"><div class="y">${esc(y)}</div>
    <div class="t">${esc(r.trackName)}</div><div class="note">${esc(r.artistName)}</div>
    <p class="note ask">${P.timeUp ? "時間到！判完這首就結算" : `你心裡想的${esc(P.guess.replace(/（.*/, ""))}對嗎？`}</p>`;
  $("#pCard").className = "card";
  pShow("pJudge"); restart($("#pCard"), "morph");
  rollYear($("#pCard .y"), y);
}
function pJudge(ok){
  if (!P || P.phase !== "judge") return;
  P.phase = "anim";
  pLog(ok ? "right" : "wrong", P.curT);
  if (ok) { haptic("right"); restart($("#pCount"), "bump"); floatAt($("#pCount"), "+1"); confetti([hexOf(3), "#f4effc", hexOf(1)], 55, .5, .42); }
  else haptic("wrong");
  $("#pCard").classList.remove("morph");
  restart($("#pCard"), ok ? "goR" : "goL");
  setTimeout(pPlayNext, reduce ? 0 : 360);
}
function pSkip(kind){
  if (!P || P.phase !== "play") return;
  P.phase = "anim";
  pLog(kind, 0); haptic("tap");
  $("#orbwrap").classList.remove("in");
  restart($("#orbwrap"), "out");
  setTimeout(pPlayNext, reduce ? 0 : 260);
}
function pLog(res, t){
  P.log.push({ r: P.cur, res, t });
  if (res === "right") { P.streak++; P.best = Math.max(P.best, P.streak); } else P.streak = 0;
  $("#pCount").textContent = P.log.filter(x => x.res === "right").length;
  const s = $("#pStreak");
  if (P.streak >= 2) { s.hidden = false; s.textContent = `🔥 ${P.streak} 連對`; restart(s, "on"); } else s.hidden = true;
  const r = P.cur;
  $("#pLast").innerHTML = `<div class="ptoast"><img alt="" src="${art(r, 100)}"><span class="m ${res}">${MK[res]}</span><span class="nm"><b>${esc(r.trackName)}</b>　${esc(r.artistName)}</span></div>`;
  restart($("#pLast .ptoast"), "in");
}

function pEnd(note){
  if (!P || P.phase === "done") return;
  P.phase = "done"; player.pause();
  $("#vig").classList.remove("on"); $("#practice").classList.add("done"); $("#quitBtn").hidden = true; $("#pLast").innerHTML = "";
  const L = P.log, n = L.filter(x => x.res === "right").length;
  const times = L.filter(x => x.res === "right" && x.t).map(x => x.t);
  const avg = times.length ? times.reduce((a, b) => a + b, 0) / times.length : 0;
  const key = "hitsterPB:" + P.durS + ":" + [...selected].sort().join("|");
  const prev = store.get(key, 0), pb = n > prev;
  if (pb) store.set(key, n);
  const stat = (v, l, i) => `<div class="stat" style="--i:${i}"><b>${v}</b><span>${l}</span></div>`;
  $("#pResult").innerHTML = `
    <p class="note">${esc(note)}</p>
    <div id="resN" class="res-n">0</div>
    <p class="res-l">${P.durS} 秒內答對 ${n} 首 ${pb && prev ? `<span class="pb stamp">新紀錄</span>` : prev ? `<span class="note">最佳 ${prev} 首</span>` : ""}</p>
    <div class="stats">
      ${stat(avg ? avg.toFixed(1) + " 秒" : "—", "平均聽出來", 0)}
      ${stat(times.length ? Math.min(...times).toFixed(1) + " 秒" : "—", "最快一次", 1)}
      ${stat(P.best, "最多連對", 2)}
    </div>
    ${L.length ? `<ol class="hist">${L.map((x, k) => `<li style="--i:${k}"><span class="m ${x.res}">${MK[x.res]}</span><img alt="" src="${art(x.r, 100)}">
      <span class="nm"><b>${esc(x.r.trackName)}</b><small>${esc(x.r.artistName)}${x.t ? `，${x.t.toFixed(1)} 秒` : ""}</small></span>
      <button data-u="${esc(x.r.previewUrl)}" aria-label="再聽一次 ${esc(x.r.trackName)}">▶</button></li>`).join("")}</ol>` : ""}
    <div class="row" style="justify-content:center">
      <button id="againBtn" class="btn pink">再挑戰一次</button>
      <button id="backBtn" class="btn ghost">回到設定</button>
    </div>`;
  pShow("pResult");
  countUp($("#resN"), n);
  if (n) haptic("win");
  if (pb && n) setTimeout(() => confetti(COLORS.map((_, i) => hexOf(i)), 150, .5, .3), 900);
}
$("#pResult").addEventListener("click", e => {
  if (e.target.closest("#againBtn")) return startPractice(P.items);
  if (e.target.closest("#backBtn")) return pQuit();
  const b = e.target.closest("[data-u]"); if (!b) return;
  const on = b.classList.contains("on");
  $("#pResult").querySelectorAll("[data-u]").forEach(x => { x.classList.remove("on"); x.textContent = "▶"; });
  if (on) { player.pause(); return; }
  player.src = b.dataset.u; player.play().catch(() => {});
  b.classList.add("on"); b.textContent = "❚❚";
});
player.addEventListener("ended", () => { if (P && P.phase === "done") $("#pResult").querySelectorAll("[data-u]").forEach(x => { x.classList.remove("on"); x.textContent = "▶"; }); });
function pQuit(){
  player.pause(); P = null;
  try { wakeLock && wakeLock.release(); } catch {}
  $("#vig").classList.remove("on");
  $("#practice").hidden = true; $("#setup").hidden = false; $("#quitBtn").hidden = true; $("#quitBtn").textContent = "結束這局";
}

$("#orb").addEventListener("pointerdown", e => { e.preventDefault(); pKnow(); });
$("#skipBtn").onclick = () => pSkip("skip");
$("#okBtn").onclick = () => pJudge(true);
$("#noBtn").onclick = () => pJudge(false);
document.addEventListener("keydown", e => {
  if (!P || e.repeat || e.target.closest("input,textarea,select")) return;
  const k = e.key;
  if (P.phase === "play") {
    if (k === " " || k === "Enter") { e.preventDefault(); pKnow(); }
    else if (k === "s" || k === "S" || k === "ArrowDown") pSkip("skip");
  } else if (P.phase === "judge") {
    if (k === "ArrowRight" || k === "y" || k === "Y") { e.preventDefault(); pJudge(true); }
    else if (k === "ArrowLeft" || k === "n" || k === "N") { e.preventDefault(); pJudge(false); }
  }
});

/* per-frame: game clock, song progress ring, and the radial "listening" visualizer */
const viz = $("#viz"), vctx = viz.getContext("2d"), viz2 = $("#viz2"), v2ctx = viz2.getContext("2d");
let energy = 0;
function pFrame(now){
  if (!P) return;
  if (P.endAt && P.phase !== "done") {
    const rem = P.endAt - now, txt = fmt(rem);
    if (txt !== P.lastClock) { P.lastClock = txt; $("#pClock").textContent = txt; if (rem > 0 && rem <= 10000) haptic("tick"); }
    $("#pBar").style.transform = `scaleX(${Math.max(0, rem / (P.durS * 1000))})`;
    const hot = rem <= 10000 && rem > 0;
    $("#pClock").classList.toggle("hot", hot); $("#vig").classList.toggle("on", hot);
    if (rem <= 0 && !P.timeUp) {
      P.timeUp = true; $("#vig").classList.remove("on");
      if (P.phase === "judge") { const a = $("#pCard .ask"); if (a) a.textContent = "時間到！判完這首就結算"; }
      else if (P.phase !== "anim") pEnd("時間到！");
    }
  }
  if (P.phase === "play" || P.phase === "anim") {
    const d = isFinite(player.duration) && player.duration > 0 ? player.duration : 30;
    $("#prog").style.setProperty("--p", Math.min(1, player.currentTime / d));
  }
  if (!$("#pPlay").hidden && !reduce) drawViz(now, viz, vctx, P.phase === "play" && !player.paused && !P.needTap);
  requestAnimationFrame(pFrame);
}
function drawViz(now, viz, vctx, live){
  const s = viz.clientWidth, dpr = devicePixelRatio || 1;
  if (!s) return;
  if (viz.width !== Math.round(s * dpr)) { viz.width = viz.height = Math.round(s * dpr); }
  vctx.setTransform(dpr, 0, 0, dpr, 0, 0); vctx.clearRect(0, 0, s, s);
  energy += ((live ? 1 : .12) - energy) * .07;
  const c = s / 2, r0 = s * .3125 + 20, N = 72, t = now / 1000;
  const beat = Math.pow(Math.max(0, Math.sin(t * Math.PI * 2.1)), 8);
  vctx.lineCap = "round"; vctx.lineWidth = Math.max(2, s * .011);
  for (let k = 0; k < N; k++) {
    const a = k / N * Math.PI * 2 - Math.PI / 2;
    const n = (Math.sin(t * 3.1 + k * .55) + Math.sin(t * 5.3 - k * .9) + Math.sin(t * 1.7 + k * 1.9)) / 3;
    const len = 3 + s * .085 * energy * (.5 + .45 * n + .55 * beat);
    const hue = 330 - 140 * (.5 + .5 * Math.sin(a * 2 + t * .8));
    vctx.strokeStyle = `hsla(${hue},95%,66%,${.35 + .6 * energy})`;
    vctx.beginPath();
    vctx.moveTo(c + Math.cos(a) * r0, c + Math.sin(a) * r0);
    vctx.lineTo(c + Math.cos(a) * (r0 + len), c + Math.sin(a) * (r0 + len));
    vctx.stroke();
  }
}

function gFrame(now){
  if (!G) return;
  if (!$("#vPlay").hidden && !reduce) drawViz(now, viz2, v2ctx, !player.paused);
  requestAnimationFrame(gFrame);
}

renderMode(); renderLists(); renderPlayers();
})();
