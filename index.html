/* ================= online room (PeerJS) =================
   The screen running the game is the host and the single source of truth. Phones that open the room
   link (or type the 4-digit code) are controllers: they send "buzz" / "vote" / "ans" and receive a small
   state snapshot after every change. PeerJS and the QR generator live in vendor/ so a room never depends on a CDN. */
const RID = "wvshit-";                                            // PeerJS id prefix, so room codes can't clash with other apps
const loadScript = srcs => new Promise((ok, no) => {
  const list = [].concat(srcs);
  const next = () => {
    const src = list.shift(); if (!src) return no(new Error("載入失敗"));
    const s = document.createElement("script"); s.src = src; s.async = true;
    s.onload = ok; s.onerror = () => { s.remove(); next(); }; document.head.appendChild(s);
  };
  next();
});
const loadPeer = () => window.Peer ? Promise.resolve() : loadScript(["vendor/peerjs-1.5.4.min.js", "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"]);
const loadQR = () => typeof qrcode === "function" ? Promise.resolve() : loadScript("vendor/qrcode.js").catch(() => {});
const PID = (() => {                                              // per tab, so two tabs on one computer count as two players
  try { let v = sessionStorage.getItem("yt.pid"); if (!v) { v = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); sessionStorage.setItem("yt.pid", v); } return v; }
  catch { return Math.random().toString(36).slice(2, 12); }
})();
const roomCode = () => String(1000 + (Math.random() * 9000 | 0));      // 4 digits: a number pad is all a phone needs
const baseUrl = () => location.href.split("#")[0].split("?")[0];
function drawQR(cv, text){
  if (!cv || typeof qrcode !== "function") return false;
  try {
    const q = qrcode(0, "M"); q.addData(text); q.make();
    const n = q.getModuleCount(), px = 6, quiet = 3, size = (n + quiet * 2) * px;
    cv.width = cv.height = size; const g = cv.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, size, size); g.fillStyle = "#07141b";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect((c + quiet) * px, (r + quiet) * px, px, px);
    return true;
  } catch { return false; }
}

/* on-screen players: with a room open they default to none, so phone players are players 1, 2, 3… */
const locals = () => (NET.on && !cfg.lt) ? [] : cfg.players;
const newPlayer = (name, i, extra) => Object.assign({ name, score: 0, combo: 0, maxCombo: 0, correct: 0, color: PCOL[i % 8] }, extra);
function buildPlayers(){
  const quiz = cfg.mode === "quiz";
  const loc = quiz ? (cfg.hostPlays ? [{ name: me, host: true }] : []) : locals().map(name => ({ name }));
  const rem = NET.list().map(g => ({ name: g.name, pid: g.pid, remote: true }));
  return [...loc, ...rem].slice(0, 8).map((p, i) => newPlayer(p.name, i, p));
}
const gameLive = () => !!(G && !G.done && (G.mode === "sing" || G.multi));

/* ---- sing: voting on a buzz ---- */
function voters(){                                                // phones other than the singer
  const c = G.cur; return G.players.map((p, i) => ({ p, i })).filter(({ p, i }) => p.remote && !p.off && i !== c.buzzer);
}
function tally(){
  const c = G.cur, vs = voters(); let yes = 0, no = 0;
  vs.forEach(({ i }) => { const v = c.votes && c.votes.get(i); if (v === true) yes++; else if (v === false) no++; });
  return { n: vs.length, yes, no, need: Math.floor(vs.length / 2) + 1 };
}
function tallyVote(){
  const c = G && G.cur; if (!c || G.mode !== "sing" || c.phase !== "buzz" || cfg.judge !== "vote") return;
  const t = tally(); if (!t.n) return;
  if (t.yes >= t.need) judge(true);
  else if (t.no >= t.need) judge(false);
  else if (t.yes + t.no >= t.n) toast("票數平手，請房主決定");
}
function voteHint(){
  if (cfg.judge !== "vote") return "";
  const t = tally();
  return t.n ? `<div class="hint">大家投票中 · 唱對 ${t.yes} ／ 唱錯 ${t.no}（共 ${t.n} 人，過半就定案）。房主也可以直接判定。</div>` : `<div class="hint">沒有其他手機玩家可以投票，由房主判定。</div>`;
}
function castVote(pi, v){
  const c = G && G.cur; if (!c || G.mode !== "sing" || c.phase !== "buzz" || cfg.judge !== "vote" || !c.votes) return;
  const p = G.players[pi]; if (!p || !p.remote || pi === c.buzzer) return;
  c.votes.set(pi, !!v); renderAll(); tallyVote();
}

/* ---- quiz (multi): answers from phones ---- */
function answerBy(pi, i){
  const c = G && G.cur; if (!c || !G.multi || c.phase !== "answer" || !(i >= 0 && i < 4) || c.picks.has(pi) || !G.players[pi]) return;
  c.picks.set(pi, { i, used: Math.min(c.dur, performance.now() - c.t0) });
  if (G.players[pi].host) { c.pick = i; vibrate(20); }
  renderAll(); checkAllAnswered();
}
function checkAllAnswered(){
  const c = G && G.cur; if (!c || !G.multi || c.phase !== "answer") return;
  const alive = G.players.filter(p => !p.off);
  if (alive.length && alive.every(p => c.picks.has(G.players.indexOf(p)))) resolveMulti();
}
function resolveMulti(){
  const c = G.cur; if (!c || c.phase !== "answer") return;
  c.phase = "reveal"; c.pick = c.pick == null ? -1 : c.pick;
  const res = [], rk = () => { const o = G.players.map((p, i) => i).sort((a, b) => G.players[b].score - G.players[a].score || a - b), m = []; o.forEach((pi, r) => m[pi] = r + 1); return m; };
  const before = rk();
  G.players.forEach((p, pi) => {
    const a = c.picks.get(pi), ok = !!a && a.i === c.answer; let gain = 0;
    if (ok) {
      p.combo++; p.maxCombo = Math.max(p.maxCombo, p.combo); p.correct++;
      const base = 60, speed = Math.round(60 * (1 - a.used / c.dur)), combo = Math.min(p.combo - 1, 10) * 8;
      gain = base + speed + combo; p.score += gain;
    } else p.combo = 0;
    res.push({ pi, ok, gain, pick: a ? a.i : -1 });
  });
  const after = rk(); c.moves = G.players.map((p, pi) => ({ f: before[pi], t: after[pi] }));
  c.results = res; G.log.push({ song: c.song, results: res });
  const h = res.find(r => G.players[r.pi].host);
  if (h ? h.ok : res.some(r => r.ok)) { beep("good"); vibrate(30); } else { beep("bad"); vibrate([40, 60, 40]); }
  const nx = G.queue[0]; if (nx && G.n < G.total) YTP.preload(nx.v, startOf(nx));
  c.revealTotal = cfg.reveal * 1000; c.revealStart = Date.now();
  renderAll(); renderPop(); runBar(c.revealTotal);
  later(afterReveal, c.revealTotal);
}
const boardOn = () => !!(G && G.multi && cfg.board && G.cur && !G.cur.board && G.n < G.total && G.queue.length);
const BOARD_MS = 5000;
function afterReveal(){ if (boardOn()) showBoard(); else nextQ(); }
function showBoard(){
  const c = G.cur; if (!c) return;
  clearTimers(); c.board = true; c.revealTotal = BOARD_MS; c.revealStart = Date.now();
  beep("good");
  renderAll(); renderPop(); runBar(BOARD_MS);
  later(nextQ, BOARD_MS);
}
function advance(){ if (!G || !G.cur || G.cur.phase !== "reveal" || G.mode !== "quiz") return; if (G.multi && boardOn()) showBoard(); else nextQ(); }

const NET = {
  on: false, status: "off", code: "", peer: null, err: "", guests: new Map(),
  list(){ return this.on ? [...this.guests.values()].filter(g => g.conn && g.conn.open) : []; },
  count(){ return this.list().length; },
  url(){ return baseUrl() + "?room=" + this.code; },
  async open(){
    if (this.on || this.status === "opening") return;
    this.status = "opening"; this.err = ""; this.refresh();
    try { await loadPeer(); } catch (e) { this.status = "off"; this.err = "PeerJS 載入失敗，請檢查網路或關閉廣告封鎖外掛。"; return this.refresh(); }
    await loadQR();
    const attempt = n => {
      const code = roomCode(), peer = new Peer(RID + code);
      const timer = setTimeout(() => { if (!this.on && this.status === "opening") { try { peer.destroy(); } catch {} this.status = "off"; this.err = "連不上配對服務，請檢查網路後重試。"; this.refresh(); } }, 15000);
      peer.on("open", () => { clearTimeout(timer); this.peer = peer; this.code = code; this.on = true; this.status = "on"; this.refresh(); this.push(); });
      peer.on("connection", conn => this.accept(conn));
      peer.on("disconnected", () => { if (this.peer === peer && !peer.destroyed) { try { peer.reconnect(); } catch {} } });
      peer.on("error", e => {
        clearTimeout(timer);
        if (e.type === "unavailable-id" && n < 6) { try { peer.destroy(); } catch {} return attempt(n + 1); }
        if (this.on && this.peer === peer) { console.warn("peer", e); return; }          // a hiccup after the room is up: keep it
        try { peer.destroy(); } catch {}
        this.status = "off"; this.err = ["network", "server-error", "socket-error", "socket-closed"].includes(e.type) ? "連不到配對服務，請檢查網路。" : "建立房間失敗（" + e.type + "）。";
        this.refresh();
      });
    };
    attempt(0);
  },
  close(){
    this.guests.forEach(g => { try { g.conn.send({ t: "closed" }); } catch {} });
    const p = this.peer; setTimeout(() => { try { p && p.destroy(); } catch {} }, 250);
    if (G && gameLive()) G.players.forEach(pl => { if (pl.remote) pl.off = true; });
    this.on = false; this.status = "off"; this.peer = null; this.code = ""; this.guests.clear();
    this.refresh(); if (G && G.players) renderRank();
  },
  accept(conn){
    conn.on("data", m => this.onData(conn, m));
    conn.on("close", () => this.drop(conn));
    conn.on("error", () => this.drop(conn));
  },
  uniqueName(name, pid){
    const taken = n => [...this.guests.values()].some(g => g.pid !== pid && g.name === n) || (G && G.players && G.players.some(p => p.pid !== pid && p.name === n)) || (G && G.multi ? false : locals().includes(n));
    let nm = name, k = 2; while (taken(nm)) nm = name.slice(0, 7) + k++;
    return nm;
  },
  onData(conn, m){
    if (!m || typeof m !== "object") return;
    if (m.t === "hello") {
      const pid = String(m.pid || "").slice(0, 40); if (!pid) return;
      const live = !!(G && G.players && !G.done && (G.mode === "sing" || G.multi));
      const old = this.guests.get(pid), inGame = live ? G.players.find(p => p.pid === pid) : null;
      const total = live ? G.players.length : locals().length + this.count();
      if (!old && !inGame && total >= 8) { try { conn.send({ t: "full" }); } catch {} setTimeout(() => { try { conn.close(); } catch {} }, 300); return; }
      if (old && old.conn !== conn) { try { old.conn.removeAllListeners && old.conn.removeAllListeners("close"); old.conn.send({ t: "kicked" }); old.conn.close(); } catch {} }
      const name = this.uniqueName(String(m.name || "").trim().slice(0, 8) || "玩家", pid);

      if (live) { renderPads(); renderRank(); renderCover(); }
      this.push(); this.refresh();
    } else if (m.t === "buzz") {

  snap(){

  renderChip(){

    const b = $("#roomBtn"); if (b) { b.hidden = !(this.on && G && G.players); if (!b.hidden) $("#roomBtnT").textContent = txt; }
    const t = $("#roomTop"); if (t) { t.hidden = !this.on; if (this.on) $("#roomTopT").textContent = txt; }
  },
  boxHTML(){

/* ---- phone controller: this page opened with ?room=… ---- */
const CTL = {
  active: false, code: ROOM_Q, peer: null, conn: null, st: null, got: 0, retry: 0, kicked: false, name: "", _rt: 0, timer: 0,
  start(){
    this.active = true;
    $("#topbar").hidden = true; $("#lobby").hidden = true; $("#game").hidden = true;
    document.title = "加入房間 · 世志猜歌王";
    const el = $("#ctl"); el.hidden = false;
    el.innerHTML = `<div class="ctop"><div class="logo"><img src="assets/logo.png" alt="世志猜歌王" width="520" height="355"></div><span class="st" id="cSt"></span></div>
      <div class="cjoin" id="cBody"><p class="kicker">跟朋友玩</p><h2 class="mega">加入<em>房間</em></h2>
        <input class="field" id="cCode" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="4 位數字房號" aria-label="房號" value="${esc(ROOM_Q)}">
        <input class="field" id="cName" maxlength="8" autocomplete="off" placeholder="你的暱稱（最多 8 字）" aria-label="暱稱" value="${esc(store.get("yt.gname", ""))}">
        <button class="btn pri" id="cGo">${icon("mic")}加入房間</button><p class="msg" id="cMsg"></p></div>`;
    const go = () => {
      const code = $("#cCode").value.replace(/\D/g, "");
      if (!/^\d{4}$/.test(code)) { $("#cMsg").textContent = "請輸入大螢幕上的 4 位數字房號。"; $("#cCode").focus(); return; }
      this.code = code; this.name = $("#cName").value.trim() || "玩家"; store.set("yt.gname", this.name);
      try { history.replaceState(null, "", baseUrl() + "?room=" + code); } catch {}
      keepAwake(); this.wait(); this.connect();
    };
    $("#cGo").onclick = go; $("#cName").onkeydown = $("#cCode").onkeydown = e => { if (e.key === "Enter") go(); };
    if (!ROOM_Q) $("#cCode").focus(); else $("#cName").focus();
    document.addEventListener("visibilitychange", () => {
      if (document.hidden || !this.name || this.kicked || !this.code) return;
      keepAwake();
      if (!this.conn || !this.conn.open) { this.retry = 0; this.connect(); }
    });
    el.addEventListener("click", e => {
      const o = e.target.closest("[data-o]"), v = e.target.closest("[data-v]");
      if (o) this.send({ t: "ans", i: +o.dataset.o });
      else if (v) this.send({ t: "vote", v: v.dataset.v === "1" });
    });
    clearInterval(this.timer); this.timer = setInterval(() => this.tick(), 250);
  },
  send(m){ try { if (this.conn && this.conn.open) this.conn.send(m); } catch {} },
  status(t, cls = ""){ const s = $("#cSt"); if (s) { s.textContent = t; s.className = "st " + cls; } },
  wait(){
    const b = $("#cBody"); if (!b) return; b.className = "cjoin"; b.style.display = "";
    b.innerHTML = `<p class="kicker">房號 ${esc(this.code)}</p><h2 class="mega">連線<em>中</em></h2><p class="cnote" id="cHint">正在找房間…</p>`;
  },
  hint(t){ const h = $("#cHint"); if (h) h.textContent = t; },
  fail(msg, again){
    this.kicked = true; clearTimeout(this._rt); this.status(msg, "bad");
    const b = $("#cBody"); if (!b) return;
    b.className = "cjoin"; b.style.display = "";
    b.innerHTML = `<p class="kicker">連線失敗</p><p class="cnote" style="font-size:17px;color:var(--text)">${esc(msg)}</p>${again ? `<button class="btn pri" id="cAgain">重新輸入房號</button>` : `<button class="btn pri" id="cReload">重新整理</button>`}`;
    if (again) $("#cAgain").onclick = () => { location.href = baseUrl() + "?room="; }; else $("#cReload").onclick = () => location.reload();
  },
  async connect(){
    clearTimeout(this._rt); this.status("連線中…");
    try { await loadPeer(); } catch { return this.fail("連線元件載入失敗，請檢查網路後重新整理。"); }
    if (this.peer) { try { this.peer.destroy(); } catch {} }
    const peer = this.peer = new Peer();
    peer.on("open", () => { if (this.peer === peer) this.dial(); });
    peer.on("error", e => {
      if (this.peer !== peer) return;
      if (e.type === "peer-unavailable") this.fail("找不到這個房間。請確認房號，或請房主確認房間還開著。", true);
      else if (["network", "server-error", "socket-error", "socket-closed"].includes(e.type)) { this.hint("連不到配對服務，重試中…請檢查網路。"); this.again(); }
      else this.again();
    });
  },
  dial(){
    const conn = this.conn = this.peer.connect(RID + this.code, { reliable: true });
    let opened = false;
    conn.on("open", () => { opened = true; this.retry = 0; conn.send({ t: "hello", pid: PID, name: this.name }); });
    conn.on("data", m => this.onData(m));
    const lost = () => { if (this.conn === conn && !this.kicked) { this.status("連線中斷，重連中…", "bad"); this.again(); } };
    conn.on("close", lost); conn.on("error", lost);
    setTimeout(() => {
      if (!opened && this.conn === conn && !this.kicked) { this.hint("還連不上。學校或公司 Wi-Fi 常擋這種連線，可以改用手機熱點或行動網路再試。"); this.again(); }
    }, 12000);
  },
  again(){
    clearTimeout(this._rt);
    if (++this.retry > 8) return this.fail("連不上房間。請確認房主還開著，學校或公司 Wi-Fi 請改用手機熱點，然後重新整理。");
    this._rt = setTimeout(() => this.connect(), 1200 + this.retry * 600);
  },
  onData(m){
    if (!m || typeof m !== "object") return;
    if (m.t === "state") { const p = this.st; m.players = Array.isArray(m.players) ? m.players : []; this.st = m; this.got = performance.now(); this.status(m.me >= 0 ? `已連線 · ${this.name}` : "已連線", "ok"); this.cues(p, m); this.render(); }
    else if (m.t === "welcome") this.status("已連線", "ok");
    else if (m.t === "full") this.fail("房間已滿（最多 8 人）。");
    else if (m.t === "closed") this.fail("房主關閉了房間。");
    else if (m.t === "kicked") this.fail("你在別的分頁或裝置加入了這個房間。");
  },
  cues(p, s){
    if (!p || s.me < 0) return;
    if (s.mode === "sing") {
      if (p.phase !== "buzz" && s.phase === "buzz" && s.buzzer === s.me) { beep("buzz"); vibrate(60); }
      else if (p.phase !== "reveal" && s.phase === "reveal" && s.winner === s.me) { beep("win"); vibrate([40, 40, 40]); }
      else if (p.phase === "buzz" && s.phase === "show" && s.locked) { beep("bad"); vibrate([40, 60, 40]); }
    } else if (s.mode === "quiz" && p.phase !== "reveal" && s.phase === "reveal" && s.mine) {
      if (s.mine.ok) { beep("good"); vibrate(30); } else { beep("bad"); vibrate([40, 60, 40]); }
    }
  },
  buzz(){
    const s = this.st; if (!s || s.mode !== "sing" || s.phase !== "show" || s.me < 0 || s.locked) return;
    vibrate(25); this.send({ t: "buzz" });
  },
  leftMs(){
    const s = this.st; if (!s) return 0;
    return Math.max(0, (s.phase === "show" || s.phase === "answer") ? s.left - (performance.now() - this.got) : s.left || 0);
  },
  tick(){
    const s = this.st; if (!s || !(s.phase === "show" || s.phase === "answer")) return;
    const l = this.leftMs(), sec = Math.ceil(l / 1000), num = $("#ringN"), arc = $("#arc"), rw = $(".ringw");
    if (num && num.textContent !== String(sec)) num.textContent = sec;
    if (arc && s.dur) arc.style.strokeDashoffset = 100 - l / s.dur * 100;
    if (rw) rw.classList.toggle("hot", sec <= 5);
  },
  rankHTML(s){
    const bd = s.board && s.mv, fl = rankFlags(s.players, this._first);
    const html = s.players.map((p, i) => ({ p, i })).sort((a, b) => b.p.score - a.p.score).map(({ p, i }, r) => {
      const first = fl.first(i), nf = fl.fresh(i);
      return `<div class="rrow${i === s.me ? " me" : ""}${first && !nf ? " first" : ""}" data-pi="${i}" ${nf ? "data-nf" : ""} style="--c:${p.color}"><span class="n">#${r + 1}</span><span class="av" style="background:${p.color}">${esc([...p.name][0] || "?")}${first && !nf ? crownHTML(false) : ""}</span><span class="nm">${esc(p.name)}${i === s.me ? `<span class="you">YOU</span>` : ""}${p.off ? "（離線）" : ""}</span>${bd && s.gains && s.gains[i] ? `<span class="st ok">+${s.gains[i]}</span>` : ""}${bd ? moveHTML(s.mv[i]) : ""}<span class="sc" style="color:${p.color}">${fmt(p.score)}${p.combo > 1 ? `<i>x${p.combo}</i>` : ""}</span></div>`;
    }).join("");
    this._first = fl.now;
    return html;
  },
  render(){
    const s = this.st, body = $("#cBody"); if (!s || !body) return;
    const me = s.me >= 0 ? s.players[s.me] : null, sec = Math.ceil(this.leftMs() / 1000);
    const col = c => `--k:${c};--k2:color-mix(in srgb,${c} 55%,#fff)`;
    const pill = s.total ? `<div class="pill">題目 ${s.n}/${s.total}</div>` : "";
    const ring = `<div class="cring">${ringHTML(sec)}</div>`;
    const song = `${s.title ? `<div class="t">${esc(s.title)}</div>` : ""}${s.artist ? `<div class="a">${esc(s.artist)}</div>` : ""}`;
    const pad = (big, can, mine) => `<button class="pad cpad${mine ? " mine" : ""}" id="cBtn" style="--c:${me ? me.color : "var(--sky)"}" ${can ? "" : "disabled"}><span class="big">${esc(big)}</span>${me ? `<small>${esc(me.name)} · ${fmt(me.score)} 分</small>` : `<small>觀戰中</small>`}</button>`;
    let blk = "", main = "", st = "";
    if (!s.mode || s.phase === "lobby" || s.phase === "other") {
      blk = `<div class="t">${s.phase === "other" ? "房主正在玩單人四選一" : "等房主開始"}</div><div class="s">${s.phase === "other" ? "這局結束後，下一局再一起玩！" : "你已經在房間裡了，房主選好題庫就會開始。"}</div>`;
    } else if (s.phase === "load") {
      blk = `${pill}<div class="t">準備中…</div><div class="s">下一首馬上開始</div>`;
    } else if (s.phase === "end") {
      blk = `<div class="t">遊戲結束</div><div class="s">看大螢幕的結果，房主可以再開一局</div>`;
    } else if (s.mode === "sing") {
      if (s.phase === "show") { blk = `${pill}${song}${ring}<div class="s">會唱的人搶先按！</div>`; main = pad(s.locked ? "這首已鎖定" : "搶唱！", !s.locked && s.me >= 0, false); }
      else if (s.phase === "buzz") {
        const b = s.players[s.buzzer], isMe = s.buzzer === s.me;
        st = col(b ? b.color : "var(--sky)");
        blk = `${pill}${song}<div class="s">${isMe ? "輪到你唱！唱完等大家判定" : esc(b ? b.name : "") + " 搶唱中…"}</div>`;
        const v = s.votes;
        if (s.judge === "vote" && s.me >= 0 && !isMe && v && v.n > 0) {
          main = `<div class="judge"><button class="btn ok${s.myVote === true ? " on" : ""}" data-v="1">${icon("check")}唱對了</button><button class="btn ng${s.myVote === false ? " on" : ""}" data-v="0">${icon("x")}唱錯了</button></div>
            <p class="cnote">${s.myVote == null ? "聽聽看，投一票！" : "已投票，可以改"} · 唱對 ${v.yes} ／ 唱錯 ${v.no}（${v.n} 人投票）</p>`;
        } else main = pad(isMe ? "你在唱！" : "別人在唱", false, isMe) + (s.judge === "vote" ? `<p class="cnote">${isMe ? "大家投票中…" : "沒有可以投票的人，由房主判定"}</p>` : "");
      } else {
        const w = s.players[s.winner]; st = w ? col(w.color) : "";
        blk = `${pill}${song}<div class="s">${w ? esc(w.name) + " 得分！" : "這首沒人唱出來"}</div>`; main = pad("等下一題", false, false);
      }
    } else {                                                          // quiz
      const mine = s.mine ? s.mine.pick : -1;
      if (s.phase === "answer") {
        blk = `${pill}${ring}<div class="s">已答 ${s.answered || 0}/${s.alive || s.players.length}</div>`;
      } else {
        const r = s.mine; const mv = s.board && s.mv && s.me >= 0 ? s.mv[s.me] : null;
        const head = s.board && mv ? `第 ${mv.t} 名` : !r ? "公布答案" : r.ok ? `答對了！+${r.gain}` : (mine < 0 ? "時間到" : "答錯了");
        st = col(r && r.ok ? "var(--lime)" : r ? "#ff8f9f" : "var(--sky)");
        blk = `${pill}<div class="t">${esc(head)}</div><div class="s">${s.board && mv ? (mv.t < mv.f ? `上升 ${mv.f - mv.t} 名 ▲` : mv.t > mv.f ? `下降 ${mv.t - mv.f} 名 ▼` : "名次不變") + " · 下一題馬上開始" : `答案：${esc(s.song || "")}`}</div>`;
      }
      main = s.board ? "" : `<div class="opts">${(s.opts || []).map((t, i) => {
        let cls = "opt";
        if (s.phase === "reveal") cls += i === s.ans ? " right" : i === mine ? " wrong" : " fade";
        else if (i === mine) cls += " pick";
        const dis = s.phase !== "answer" || mine >= 0 || s.me < 0;
        return `<button class="${cls}" data-o="${i}" ${dis ? "disabled" : ""}><span class="ot">${esc(t)}</span><span class="mk">${s.phase === "reveal" && i === s.ans ? "✓" : s.phase === "reveal" && i === mine ? "✕" : ""}</span></button>`;
      }).join("")}</div>${s.phase === "answer" && mine >= 0 ? `<p class="cnote">已作答，等其他人…</p>` : ""}`;
    }
    body.className = ""; body.style.display = "contents";
    const snap = rankSnap(body.querySelector(".crank")), rank = this.rankHTML(s);
    body.innerHTML = `<div class="cblk" style="${st}">${blk}</div>${main}${rank ? `<div class="crank">${rank}</div>` : ""}`;
    rankPlay(body.querySelector(".crank"), snap);
    const btn = $("#cBtn"); if (btn) btn.onpointerdown = e => { e.preventDefault(); this.buzz(); };
  }
};

/* ================= boot ================= */
paintIcons(); renderMe();
if (ROOM_ON) CTL.start();
else { renderGrid(); $("#quickSub").textContent = `全部 ${allSongs().filter(usable).length} 首隨機四選一`; }
window.__game = { get G(){ return G; }, YTP, cfg };   // for debugging in the console
})();
</script>
<script>
/* liquid glass: the specular highlight follows the pointer (pure decoration) */
(function(){
  const SEL = ".opt,.card,.hcard,.btn,.pad,.nav,.rrow,.sheet,.rcard,.me,.bar,.scrub,.box,.mode,.lrow";
  let raf = 0, last = null;
  addEventListener("pointermove", e => {
    const g = e.target && e.target.closest ? e.target.closest(SEL) : null;
    if (!g) return;
    last = { g, x: e.clientX, y: e.clientY };
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0; const { g, x, y } = last, r = g.getBoundingClientRect();
      g.style.setProperty("--mx", ((x - r.left) / r.width * 100).toFixed(1) + "%");
      g.style.setProperty("--my", ((y - r.top) / r.height * 100).toFixed(1) + "%");
    });
  }, { passive: true });
})();
</script>
<script src="decor.js?v=6" defer></script>
</body>
