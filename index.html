<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>世志猜歌王</title>
<meta name="description" content="世志猜歌王：和朋友一起聽前奏、搶唱的猜歌派對遊戲。">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="世志猜歌王">
<meta property="og:description" content="和朋友一起聽前奏、搶唱的猜歌派對遊戲。">
<meta property="og:image" content="https://balala-bubu.github.io/wvs_hitster/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://www.youtube-nocookie.com">
<link rel="dns-prefetch" href="https://i.ytimg.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* brand colors, taken from the World Volunteer Society logo: sky, lime, amber */
  --sky:#6cc5d6; --lime:#8cc63f; --amber:#ffb23f; --ink:#07141b;
  --bg:#070b14; --bg2:#0b111c; --panel:#0e1623; --panel2:#132033; --panel3:#1a2b42;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
  --text:#f2f6fa; --mute:#9aa8b8; --dim:#66768a;
  --teal:var(--sky); --teal2:#2a8f8c; --tealbg:rgba(108,197,214,.12);
  --sun:var(--amber); --good:var(--lime); --goodbg:rgba(140,198,63,.16); --bad:#ff6b7d; --badbg:rgba(255,107,125,.14);
  --grad:linear-gradient(100deg,#6cc5d6 0%,#8cc63f 52%,#ffb23f 100%);
  --r:18px; --r2:12px;
  --num:"Outfit","Noto Sans TC",system-ui,sans-serif;
  --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.5 "Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;-webkit-font-smoothing:antialiased}
body{background:none;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.45}
[hidden]{display:none!important}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.18em}
kbd{font:600 11px/1 var(--num);border:1px solid var(--line2);border-radius:6px;padding:4px 6px;color:var(--mute);background:rgba(255,255,255,.03)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;gap:12px}
.logo{font:700 26px/1 var(--num);letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font:500 12px "Noto Sans TC";letter-spacing:0;color:var(--mute)}
.me{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border:1px solid var(--line2);border-radius:999px;background:var(--panel)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--num);color:#062022;background:var(--grad);flex:none}

/* ---------- lobby ---------- */
.lobby{padding:0 28px 120px;max-width:1500px;margin:0 auto}
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;padding:8px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
.hcard{display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:16px;border:1px solid transparent;text-align:left;transition:.2s}
.hcard .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font-size:20px;flex:none}
.hcard b{font-size:19px;display:block}
.hcard span{color:var(--mute);font-size:13px}
.hcard.on{background:linear-gradient(90deg,rgba(108,197,214,.13),rgba(108,197,214,.04));border-color:rgba(108,197,214,.45);box-shadow:0 0 30px rgba(108,197,214,.08) inset}
.hcard.on .ic{border-color:rgba(108,197,214,.5);color:var(--teal)}
.hcard:not(.on):hover{background:rgba(255,255,255,.03)}
.lib>section{min-width:0}
.lib{display:grid;grid-template-columns:250px 1fr;gap:20px;margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.012)}
.side{display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line);padding-right:18px}
.nav{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;color:#cfd8df;text-align:left;border:1px solid transparent}
.nav:hover{background:rgba(255,255,255,.035)}
.nav.on{background:var(--panel2);border-color:rgba(108,197,214,.35);color:#fff;box-shadow:inset 3px 0 0 var(--teal)}
.side .grow{flex:1;min-height:20px}
.cta{border:1px dashed rgba(108,197,214,.35);border-radius:16px;padding:16px;font-size:13px;color:var(--mute);line-height:1.6}
.cta b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.cta code{background:rgba(255,255,255,.06);padding:1px 5px;border-radius:5px;color:#cfe}
.side a{color:var(--dim);font-size:12px;text-decoration:none;padding:4px 6px}
.side a:hover{color:var(--mute)}
.bar{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:18px;margin-bottom:14px}
.search{flex:1;display:flex;align-items:center;gap:10px;padding:0 16px;height:46px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.search input::placeholder{color:var(--dim)}
.chip{font-size:13px;color:var(--mute);border:1px solid var(--line2);border-radius:999px;padding:6px 12px;white-space:nowrap}
.seg{display:flex;padding:4px;border-radius:999px;border:1px solid var(--line2);gap:2px}
.seg button{width:38px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--mute)}
.seg button.on{background:var(--panel3);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);text-align:left;transition:transform .2s,border-color .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);border-color:rgba(108,197,214,.35)}
.cv{position:relative;aspect-ratio:16/8;background:#111;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden}
.cv img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9)}
.cv.one{grid-template-columns:1fr;grid-template-rows:1fr}
.cv:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 40%,rgba(8,12,16,.6))}
.tags{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:1;flex-wrap:wrap}
.tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(5,8,11,.72);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.cb{padding:14px 18px 16px;display:flex;flex-direction:column;gap:6px}
.cb h3{margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.meta .star{color:var(--sun)}
.stats{display:flex;gap:16px;font:600 15px var(--num);color:#d6dee5;margin-top:6px;align-items:center}
.stats span{display:flex;align-items:center;gap:6px}
.stats .i{color:var(--teal)}
.grid.rows{grid-template-columns:1fr}
.grid.rows .card{flex-direction:row;align-items:center}
.grid.rows .cv{width:200px;flex:none;aspect-ratio:16/9}
.grid.rows .cb{flex:1;min-width:0}
.empty{grid-column:1/-1;padding:50px 20px;text-align:center;color:var(--mute);border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 24px;border-radius:14px;font-weight:700;border:1px solid var(--line2);background:var(--panel2);white-space:nowrap}
.btn:hover:not(:disabled){border-color:rgba(255,255,255,.25)}
.btn.pri{background:var(--grad);color:#08201f;border:0;box-shadow:0 8px 30px rgba(108,197,214,.18)}
.btn.pri:hover:not(:disabled){filter:brightness(1.06)}
.btn.sm{height:38px;padding:0 14px;border-radius:11px;font-size:14px;font-weight:600}
.btn.danger{color:#ffb3b3;border-color:rgba(255,107,107,.35)}
.btn.warn{color:var(--sun);border-color:rgba(255,178,63,.35)}
.btn.info{color:#9fd8ff;border-color:rgba(120,190,255,.35)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);animation:fade .2s}
.sheet{width:min(1180px,72vw);height:100%;background:linear-gradient(180deg,#0c151d,#091017);border-left:1px solid var(--line2);border-radius:24px 0 0 24px;display:flex;flex-direction:column;animation:slide .28s cubic-bezier(.2,.8,.2,1)}
.sheet.narrow{width:min(720px,100vw)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.mh{display:flex;align-items:center;gap:12px;padding:20px 28px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:24px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh .x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.mh .x:hover{background:rgba(255,255,255,.06)}
.mh .esc{font-size:13px;color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 11px;border:1px solid var(--line2);border-radius:999px;color:#cfd8df;white-space:nowrap}
.mb{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.mb>div{padding:24px 28px;overflow:auto}
.mb>div+div{border-left:1px solid var(--line)}
.mf{display:flex;align-items:center;gap:12px;padding:16px 28px calc(16px + var(--safeB));border-top:1px solid var(--line);background:rgba(0,0,0,.2)}
.mf .lbl{flex:1;min-width:0}
.mf .lbl small{display:block;font-size:12px;color:var(--mute);letter-spacing:.15em}
.mf .lbl b{font-size:17px}
.dcover{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;background:#000;border:1px solid var(--line)}
.dcover img{width:100%;height:100%;object-fit:cover}
.dcover .tags{top:12px;left:12px}
.dstats{display:flex;gap:18px;align-items:center;padding:14px 4px;color:#cfd8df;flex-wrap:wrap}
.dstats span{display:flex;gap:7px;align-items:center}
.dstats .i{color:var(--teal)}
.dstats .sp{flex:1}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin:8px 0 6px}
.tabs button{height:42px;border-radius:11px;color:var(--mute);font-weight:600}
.tabs button.on{background:var(--panel3);color:#fff}
.tracks{list-style:none;margin:0;padding:0}
.tracks li{display:flex;gap:14px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.tracks img{width:88px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#111;flex:none}
.tracks .tt{flex:1;min-width:0}
.tracks .tt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tracks .tt small{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tracks .n{font:600 13px var(--num);color:var(--dim)}
.howto{color:#c5d0d9;line-height:1.8;font-size:14.5px}
.howto h4{margin:16px 0 4px;color:#fff}
.howto p{margin:0}
.lbh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lbh h3{margin:0;font-size:21px}
.mbox{border:1px solid var(--line2);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.015);margin-bottom:14px}
.mbox .t{flex:1}
.mbox .t b{display:block}
.mbox .t small{color:var(--mute)}
.sel{background:transparent;border:0;font:700 22px var(--num);color:#fff;outline:0;cursor:pointer}
.sel option{background:#111;color:#fff;font-size:15px}
.lrow{display:flex;align-items:center;gap:14px;padding:13px 18px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:rgba(255,255,255,.015)}
.lrow .rk{font:700 16px var(--num);width:34px;color:#cfd8df}
.lrow .who{flex:1;min-width:0}
.lrow .who b{display:block}
.lrow .who small{color:var(--mute);font-size:12.5px}
.lrow .sc{font:700 18px var(--num)}
.lrow.g1{border-color:rgba(255,178,63,.5);background:linear-gradient(90deg,rgba(255,178,63,.08),transparent)}
.lrow.g2{border-color:rgba(200,215,230,.38)}
.lrow.g3{border-color:rgba(214,150,100,.42);background:linear-gradient(90deg,rgba(214,150,100,.06),transparent)}
.lrow.mine{box-shadow:inset 3px 0 0 var(--teal)}
.note{color:var(--mute);font-size:13.5px;padding:14px 18px;border:1px solid var(--line);border-radius:14px}

/* settings */
.setup{display:grid;grid-template-columns:260px 1fr;flex:1;overflow:hidden}
.setup aside{padding:24px;border-right:1px solid var(--line);overflow:auto}
.setup aside img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;display:block}
.setup aside b{display:block;margin-top:12px;font-size:17px}
.setup aside small{color:var(--mute)}
.setup .form{padding:24px 30px 40px;overflow:auto}
.sec{margin-bottom:26px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:700;font-size:16.5px}
.sh .i{color:var(--teal)}
.sh small{margin-left:auto;font-weight:400;color:var(--mute);font-size:13px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:18px;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.015)}
.mode .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--panel3);font-size:19px;flex:none}
.mode b{display:block;font-size:16px}
.mode span{font-size:13px;color:var(--mute)}
.mode.on{border-color:rgba(108,197,214,.6);background:linear-gradient(90deg,rgba(108,197,214,.12),rgba(108,197,214,.03))}
.mode.on .ic{background:rgba(108,197,214,.18);color:var(--teal)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper button.rd{width:50px;height:50px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:20px}
.stepper .v{font:700 34px var(--num)}
.stepper .v small{font:500 15px "Noto Sans TC";color:var(--mute);margin-left:4px}
.quick{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.quick button{padding:6px 14px;border-radius:999px;border:1px solid var(--line2);font:600 13.5px var(--num);color:#cfd8df}
.quick button.on{border-color:var(--teal);color:#fff;background:var(--tealbg)}
.box{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:rgba(255,255,255,.015)}
.box+.box{margin-top:12px}
.box .bt{display:flex;align-items:center;gap:8px;font-weight:700}
.box .bd{font-size:13px;color:var(--mute);margin:3px 0 10px}
.rangev{font:700 26px var(--num)}
input[type=range]{width:100%;accent-color:var(--teal);height:28px}
.opts3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt3{padding:14px 16px;border-radius:14px;border:1px solid var(--line2);text-align:left}
.opt3 b{display:block;font-size:15px}
.opt3 span{font-size:12.5px;color:var(--mute)}
.opt3.on{border-color:rgba(255,178,63,.65);background:linear-gradient(90deg,rgba(255,178,63,.1),transparent)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:14px}
.prow .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 10px var(--c)}
.prow input{flex:1;min-width:0;background:none;border:0;outline:0;font-weight:600}
.prow kbd{flex:none}
.prow .rm{color:var(--dim);width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.prow .rm:hover{color:var(--bad);background:var(--badbg)}
.addp{border:1px dashed var(--line2);border-radius:14px;color:var(--mute);min-height:48px}
.field{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;outline:0}
.field:focus{border-color:var(--teal)}
textarea.field{min-height:260px;resize:vertical;font:14px/1.6 ui-monospace,Menlo,monospace}
.msg{color:var(--sun);font-size:13.5px;margin:0}

/* ---------- game ---------- */
.game{display:grid;grid-template-columns:330px 1fr;gap:24px;padding:4px 28px 28px;max-width:1700px;margin:0 auto}
.rank{display:flex;flex-direction:column;gap:6px}
.rank h4{margin:6px 10px 6px;font-size:12.5px;color:var(--mute);font-weight:500;letter-spacing:.1em}
.rrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid transparent;transition:background .3s}
.rrow .n{font:600 13px var(--num);color:var(--mute);width:26px}
.rrow .av{width:36px;height:36px}
.rrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rrow .you{font:600 10.5px var(--num);border:1px solid rgba(108,197,214,.5);color:var(--teal);border-radius:999px;padding:1px 7px;margin-left:6px}
.rrow .st{font-size:12px;border:1px solid var(--line2);border-radius:999px;padding:2px 9px;white-space:nowrap}
.rrow .st.ok{border-color:rgba(140,198,63,.5);color:var(--good)}
.rrow .st.no{border-color:rgba(255,107,107,.45);color:var(--bad)}
.rrow .st.hot{border-color:var(--c,var(--sun));color:var(--c,var(--sun))}
.rrow .sc{font:700 16px var(--num);color:var(--good);min-width:52px;text-align:right}
.rrow .sc i{font-style:normal;color:var(--sun);font-size:13px;margin-left:4px}
.rrow.me{background:linear-gradient(90deg,rgba(108,197,214,.1),rgba(255,255,255,.02));border-color:rgba(108,197,214,.25)}
.rrow.ghost{opacity:.55}
.rrow.ghost .sc{color:#cfd8df}
.rrow.lead{background:linear-gradient(90deg,rgba(255,178,63,.1),rgba(255,255,255,.02));border-color:rgba(255,178,63,.25)}
.rrow.lock{opacity:.4}
.arena{min-width:0;display:flex;flex-direction:column;gap:18px}
.ahead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ahead h1{margin:0;flex:1;min-width:200px;font:700 34px/1.2 var(--num)}
.ahead h1 small{display:block;font:500 14px "Noto Sans TC";color:var(--mute)}
.stage{position:relative;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--line);height:clamp(260px,46vh,600px)}
.ytwrap{position:absolute;inset:0;pointer-events:none;z-index:0}
.btn.danger.armed{background:#c0392b;border-color:#c0392b;color:#fff}
.hnote{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:12px;padding:16px;color:var(--mute);font-size:13px}
.thumbL{position:absolute;inset:0;background:#000 center/contain no-repeat;opacity:0;transition:opacity .3s}
.thumbL.on{opacity:1}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;background:radial-gradient(600px 300px at 50% 45%,#0f1a24,#060a0e);transition:opacity .45s}
.cover.off{opacity:0;pointer-events:none}
.pill{font:700 17px var(--num);padding:6px 18px;border:1px solid rgba(255,178,63,.45);border-radius:999px;color:#fff;background:rgba(255,178,63,.06)}
.ringw{position:relative;width:190px;height:190px;display:grid;place-items:center}
.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .trk{stroke:rgba(255,255,255,.07)}
.ring{filter:drop-shadow(0 0 9px rgba(108,197,214,.5))}
.ring .arc{stroke:var(--teal);stroke-linecap:round;stroke-dasharray:100;transition:stroke .3s}
.ringw.hot .ring{filter:drop-shadow(0 0 9px rgba(255,107,107,.55))}
.ringw.hot .arc{stroke:var(--bad)}
.ringw b{font:800 76px/1 var(--num)}
.ringw.spin .ring{animation:spin 1.1s linear infinite}
.ringw.spin .arc{stroke-dashoffset:72!important}
@keyframes spin{to{transform:rotate(270deg)}}
.cnt{font:600 16px var(--num);padding:6px 18px;border:1px solid var(--line2);border-radius:999px}
.singT{font:900 clamp(34px,6vw,72px)/1.15 "Noto Sans TC";letter-spacing:.02em;max-width:92%;text-wrap:balance}
.singA{font-size:clamp(17px,2.2vw,24px);color:#c9d4dc;margin-top:-6px}
.singH{color:var(--mute);font-size:14px}
.buzzN{font:900 clamp(30px,5vw,56px)/1.15 "Noto Sans TC";color:var(--c)}
.cover .mini{transform:scale(.62);margin:-34px 0}
.vinfo{position:absolute;left:0;right:0;top:0;padding:18px 22px 40px;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);opacity:0;transition:opacity .4s;pointer-events:none}
.vinfo.on{opacity:1}
.vinfo b{display:block;font-size:20px;text-shadow:0 2px 8px #000}
.vinfo small{color:#cfd8df}
.sctl{position:absolute;bottom:16px;display:flex;align-items:center;gap:6px;z-index:3}
.sctl.l{left:16px;padding:4px;border-radius:999px;background:rgba(10,15,20,.75);border:1px solid var(--line2)}
.sctl.l button{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute)}
.sctl.l button.on{background:var(--panel3);color:#fff}
.sctl.r{right:18px;gap:10px;font:600 15px var(--num);padding:6px 12px;border-radius:999px;background:rgba(10,15,20,.6)}
.sctl.r input{width:150px}
.tap{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);z-index:4}
.pop{position:absolute;left:5%;top:50%;transform:translateY(-50%);z-index:5;padding:22px 30px;border-radius:20px;background:linear-gradient(135deg,rgba(40,34,18,.92),rgba(14,18,24,.92));border:1px solid rgba(255,178,63,.3);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:popin .45s cubic-bezier(.2,1.4,.4,1);min-width:240px}
.pop.no{background:linear-gradient(135deg,rgba(50,18,20,.92),rgba(14,18,24,.92));border-color:rgba(255,107,107,.35)}
.pop .big{font:800 72px/1 var(--num);color:var(--sun);text-shadow:0 0 30px rgba(255,178,63,.35)}
.pop .big i{font:700 26px var(--num);font-style:normal;color:#fff;margin-left:8px}
.pop .sub{font-size:20px;font-weight:700;margin-top:8px}
.pop .ans{font-size:14px;color:#cfd8df;margin-top:6px;max-width:380px}
.pop .parts{display:flex;gap:12px;margin-top:10px;font:600 13px var(--num);color:var(--mute)}
@keyframes popin{from{opacity:0;transform:translateY(-50%) scale(.7)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{position:relative;display:flex;align-items:center;gap:14px;min-height:104px;padding:18px 26px 18px 34px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,#0d141b,#0a1016);text-align:left;font-size:clamp(16px,1.6vw,24px);font-weight:500;line-height:1.35;transition:transform .12s,border-color .2s,background .3s}
.opt .ot{flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.opt:hover:not(:disabled){border-color:rgba(108,197,214,.4);transform:translateY(-2px)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt:disabled{opacity:1;cursor:default}
.opt.wait .ot{opacity:.55}
.opt.pick{border-color:rgba(108,197,214,.6);background:linear-gradient(180deg,#123236,#0c1c20)}
.opt.right{border-color:rgba(140,198,63,.65);background:linear-gradient(180deg,#14402f,#0d241c)}
.opt.wrong{border-color:rgba(255,107,107,.55);background:linear-gradient(180deg,#3f1719,#200d0f)}
.opt.fade{opacity:.4}
.opt .mk{position:absolute;right:16px;bottom:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px}
.opt.right .mk{background:var(--good);color:#04130c}
.opt.wrong .mk{background:var(--bad);color:#200}
.judge{display:flex;gap:14px;justify-content:center;align-items:stretch;flex-wrap:wrap;padding:6px 0}
.judge .btn{height:66px;font-size:18px;padding:0 30px;border-radius:18px;flex:1;max-width:330px}
.judge .ok{background:linear-gradient(180deg,#1d5a41,#123b2b);border-color:rgba(140,198,63,.6);color:#d7ffe9}
.judge .ng{background:linear-gradient(180deg,#5a1d22,#3b1215);border-color:rgba(255,107,107,.55);color:#ffe0e0}
.judge .hint{flex-basis:100%;text-align:center;color:var(--mute);font-size:14px}

/* sing pads */
.game.sing{grid-template-columns:200px minmax(0,1fr) 200px}
.game.sing .rank{display:none}
.pads{display:flex;flex-direction:column;gap:14px;justify-content:center}
.game:not(.sing) .pads{display:none}
.pad{position:relative;flex:1;max-height:190px;min-height:84px;border-radius:22px;border:2px solid var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,#0b1117),#0a0f14 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px;transition:transform .08s,opacity .2s;box-shadow:0 0 0 0 var(--c)}
.pad b{font-size:19px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad .ps{font:800 34px/1 var(--num);color:var(--c)}
.pad kbd{position:absolute;top:10px;right:10px}
.pad:active:not(:disabled){transform:scale(.96)}
.pad.lock{opacity:.3;filter:grayscale(.8)}
.pad.buzz{animation:buzz .6s ease-out;box-shadow:0 0 40px var(--c)}
.pad.idle{opacity:.6}
@keyframes buzz{0%{transform:scale(1.08)}100%{transform:scale(1)}}
.pad .lk{position:absolute;bottom:8px;font-size:12px;color:var(--mute)}

/* result */
.result{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(3,5,8,.82);backdrop-filter:blur(6px);padding:20px;animation:fade .3s;overflow:auto}
.rcard{width:min(760px,100%);border-radius:26px;border:1px solid var(--line2);background:linear-gradient(180deg,#0f1922,#0a1016);padding:30px;max-height:100%;overflow:auto}
.rcard h2{margin:0 0 4px;font-size:15px;color:var(--mute);font-weight:500;letter-spacing:.15em}
.rbig{font:800 84px/1 var(--num);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.rgrid div{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rgrid small{display:block;color:var(--mute);font-size:12px}
.rgrid b{font:700 22px var(--num)}
.rlist{list-style:none;padding:0;margin:0 0 20px;max-height:300px;overflow:auto}
.rlist li{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
.rlist .mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none}
.rlist .ok{background:var(--goodbg);color:var(--good)}
.rlist .no{background:var(--badbg);color:var(--bad)}
.rlist .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlist a{color:var(--mute);font-size:12px}
.rlist .g{font:600 13px var(--num);color:var(--sun)}
.ract{display:flex;gap:12px;flex-wrap:wrap}
.ract .btn{flex:1}
.podium .lrow .sc{color:var(--c)}

.toast{position:fixed;left:50%;bottom:calc(30px + var(--safeB));transform:translateX(-50%);z-index:90;background:#1a2530;border:1px solid var(--line2);padding:12px 20px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fade .2s;max-width:90vw;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:95}
.flashL{position:fixed;inset:0;pointer-events:none;z-index:30;background:radial-gradient(circle at center,transparent 40%,var(--c));opacity:0}
.flashL.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}

/* ---------- motion that links the screens together ---------- */
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
@keyframes swapin{from{opacity:0;transform:translateX(12px)}}
@keyframes sheetout{to{transform:translateX(36px);opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes popout{to{opacity:0;transform:translateY(-50%) scale(.94)}}
@keyframes mkpop{from{transform:scale(.4);opacity:0}}
@keyframes rcin{from{opacity:0;transform:translateY(14px) scale(.97)}}
@keyframes bump{40%{transform:scale(1.35)}}
.lobby:not([hidden]),.game:not([hidden]){animation:viewin .32s cubic-bezier(.2,.8,.2,1)}
.sheet.swap>:not(.mh){animation:swapin .24s cubic-bezier(.2,.8,.2,1)}
.modal.out{animation:fadeout .2s forwards;pointer-events:none}
.modal.out .sheet{animation:sheetout .2s forwards}
.rcard{animation:rcin .4s cubic-bezier(.2,.8,.2,1)}

/* two stacked players: the one in front is the one playing */
.ytslot{position:absolute;inset:0;opacity:0}
.ytslot.front{opacity:1;z-index:2}
.ytwrap iframe,.ytslot>div{width:100%;height:100%;display:block;border:0}

/* stage cover: fades in quickly (so the next song's picture never shows), fades out gently */
.cover{transition:opacity .12s}
.cover.off{transition:opacity .45s}
.cover.snap,.cover.snap.off,.thumbL.snap,.vinfo.snap{transition:none!important}
.cover.swapin>*{animation:fade .2s}
.cover.peek{justify-content:flex-start;gap:6px;padding-top:14px;background:linear-gradient(180deg,rgba(5,8,10,.9),rgba(5,8,10,.55) 34%,rgba(5,8,10,0) 60%)}
.cover.peek .pill,.cover.peek .singH{display:none}
.cover.peek .singT{font-size:clamp(22px,3.4vw,38px)}
.cover.peek .singA{font-size:15px}
.cover.peek .buzzN{font-size:clamp(18px,2.6vw,28px)}
.ringw.slow .ring{animation:spin 1.1s linear infinite}
.ringw.slow .arc{stroke-dashoffset:72!important}

/* gap between questions */
.nextbar{position:absolute;left:0;right:0;bottom:0;height:4px;z-index:3;opacity:0;transition:opacity .2s;pointer-events:none}
.nextbar.on{opacity:1}
.nextbar i{display:block;height:100%;background:var(--grad);transform-origin:left;transform:scaleX(0)}
.pop.out{animation:popout .25s forwards;pointer-events:none}
.opts.enter .opt{animation:fade .22s}
.opt .mk:empty{display:none}
.opt.right .mk,.opt.wrong .mk{animation:mkpop .3s cubic-bezier(.2,1.4,.4,1)}
.rrow .sc b{font-weight:700}
.pad .ps.bump{animation:bump .35s ease-out}
.pad .lk{display:none}
.pad.lock .lk{display:block}
.pad{transition:transform .08s,opacity .25s,filter .25s,box-shadow .25s}

/* timeline scrubber (sing mode) */
.scrub{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:var(--panel);flex-wrap:wrap;animation:fade .2s}
.scrub button{height:38px;min-width:44px;padding:0 11px;border-radius:11px;border:1px solid var(--line2);font:600 13px var(--num);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#d6dee5}
.scrub button:hover{border-color:rgba(255,255,255,.28)}
.scrub #scrubPlay{width:44px;padding:0;background:var(--panel3)}
.scrub .tm{font:600 13px var(--num);color:var(--mute);min-width:40px;text-align:center}
.scrubline{display:flex;align-items:center;gap:8px;flex:1;min-width:200px}
.scrub input[type=range]{flex:1;min-width:0;margin:0}
.scrub .sp{flex:1;min-width:8px}
@media (max-width:860px){
  .scrub{padding:8px 10px;gap:6px}
  .scrub button{height:36px;min-width:38px;padding:0 8px}
  .scrub .long{display:none}
  .scrubline{order:-1;flex-basis:100%}
}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .sheet{width:100vw;border-radius:0}
  .game{grid-template-columns:260px 1fr;padding:4px 18px 24px}
}
@media (max-width:860px){
  .top{padding:14px 16px}
  .lobby{padding:0 16px 100px}
  .hero{grid-template-columns:1fr}
  .lib{grid-template-columns:1fr;padding:12px}
  .side{border-right:0;padding-right:0;flex-direction:row;overflow-x:auto;gap:6px}
  .side .nav{white-space:nowrap;padding:10px 14px;flex:none}
  .side .grow,.side .cta,.side a{display:none}
  .mb{display:block}
  .mb>div{overflow:visible}
  .mf .lbl{display:none}
  .mf .btn{flex:1;padding:0 12px}
  .mb>div+div{border-left:0;border-top:1px solid var(--line)}
  .setup{grid-template-columns:1fr}
  .setup aside{display:none}
  .setup .form{padding:18px 16px 30px}
  .two,.modes{grid-template-columns:1fr}
  .mh,.mf{padding-left:16px;padding-right:16px}
  .mb>div{padding:18px 16px}
  .game{grid-template-columns:1fr;padding:0 12px 18px;gap:12px}
  .rank{flex-direction:row;overflow-x:auto;gap:6px}
  .rank h4,.rank .ghost{display:none}
  .rrow{flex:none;padding:8px 12px}
  .ahead h1{font-size:22px;min-width:0}
  .ahead .btn span:not([data-i]){display:none}
  .ahead .btn{padding:0 11px}
  .bar{flex-wrap:wrap}
  .bar .search{flex-basis:100%}
  .sctl.r{display:none}
  .sctl.l{top:10px;right:10px;bottom:auto;left:auto}
  .sctl.l button{padding:7px 10px}
  .game.sing .singH{display:none}
  .stage{height:clamp(220px,40vh,420px)}
  .ringw{width:140px;height:140px}.ringw b{font-size:54px}
  .opts{gap:10px}
  .opt{min-height:90px;padding:14px 14px 14px 16px;font-size:15px;border-radius:16px}
  .opt kbd{display:none}
  .pop{left:50%;transform:translate(-50%,-50%);padding:16px 20px;min-width:0;width:max-content;max-width:88%}
  @keyframes popin{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}}
  .pop .big{font-size:52px}
  .sctl.l button span:not([data-i]){display:none}
  .rgrid{grid-template-columns:1fr 1fr}
  .rbig{font-size:64px}
  /* sing on a phone: pads on top and bottom; top row faces the other side of the table */
  .game.sing{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;min-height:calc(100dvh - 70px)}
  .game.sing .pads{flex-direction:row;gap:8px}
  .game.sing #padsA{order:-1}
  .game.sing #padsA .pad{transform:rotate(180deg)}
  .game.sing #padsA .pad:active:not(:disabled){transform:rotate(180deg) scale(.96)}
  .pad{min-height:96px;max-height:none;border-radius:18px}
  .pad kbd{display:none}
  .game.sing .stage{height:clamp(200px,34vh,380px)}
  .judge .btn{height:58px;font-size:16px;padding:0 16px}
}
@media (max-width:480px){
  .grid{grid-template-columns:1fr}
  .grid.rows .cv{width:120px}
  .hcard{padding:14px}
  .stats{gap:12px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* >>> theme layer (color blocks + liquid glass) */
/* =====================================================================
   THEME LAYER: Wrapped-style color blocks + liquid glass
   Palette = World Volunteer Society logo (sky / lime / amber).
   Rule of thumb: backdrop-filter only on leaf surfaces, never nested,
   so every glass layer really sees the drifting color behind it.
   ===================================================================== */
:root{
  --g-bg:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 55%,rgba(255,255,255,.1));
  --g-edge:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.1),inset 1px 0 0 rgba(255,255,255,.22),inset -1px 0 0 rgba(255,255,255,.08);
  --g-drop:0 18px 40px -14px rgba(0,0,0,.55);
  --g-blur:blur(22px) saturate(1.7);
  --ease-pop:cubic-bezier(.2,1.35,.4,1);
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --mute:#b4c1d0; --dim:#8fa1b5;   /* lighter greys: text sits on translucent glass */
}
html{background:#070b14;overflow-x:clip}
body{overflow-x:hidden;overflow-x:clip}
@keyframes viewin{from{transform:translateY(12px)}}

/* ---------- aura: slow drifting color behind the glass ---------- */
.aura{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(120% 80% at 50% 0%,#0e1d33 0%,#070b14 62%)}
.aura i{position:absolute;border-radius:50%;filter:blur(72px);will-change:transform}
.aura .b1{width:64vmax;height:64vmax;left:-20vmax;top:-26vmax;opacity:.62;background:radial-gradient(circle at 38% 38%,#6cc5d6,#2a7f94 72%);animation:drift1 26s ease-in-out infinite alternate}
.aura .b2{width:60vmax;height:60vmax;right:-22vmax;bottom:-28vmax;opacity:.5;background:radial-gradient(circle at 42% 42%,#8cc63f,#456f1a 72%);animation:drift2 33s ease-in-out infinite alternate}
.aura .b3{width:44vmax;height:44vmax;right:4vmax;top:2vmax;opacity:.4;background:radial-gradient(circle,#ffb23f,#a85a14 74%);animation:drift3 39s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(16vmax,12vmax,0) scale(1.14) rotate(24deg)}}
@keyframes drift2{to{transform:translate3d(-18vmax,-10vmax,0) scale(1.1) rotate(-18deg)}}
@keyframes drift3{to{transform:translate3d(-24vmax,22vmax,0) scale(.86) rotate(30deg)}}

/* ---------- glass surfaces ---------- */
.me,.hcard,.card,.bar,.rrow,.scrub,.sctl.l,.sctl.r,.pop,.toast,.opt,.pad,.btn{
  background:var(--g-bg);border:1px solid rgba(255,255,255,.22);box-shadow:var(--g-edge),var(--g-drop);
}
.me,.hcard,.card,.bar,.rrow,.scrub,.sctl.l,.sctl.r,.pop,.toast,.opt,.pad,.sheet,.rcard,.tap{
  -webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);
}
.me,.hcard,.card,.bar,.rrow,.scrub,.btn,.sheet,.rcard{position:relative}
/* specular highlight that follows the pointer (--mx / --my set by the small script at the bottom) */
.me::before,.hcard::before,.card::before,.bar::before,.rrow::before,.scrub::before,.btn::before,.opt::before,.pad::before,.nav::before,.box::before,.mode::before,.lrow::before,.sheet::before,.rcard::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;opacity:0;transition:opacity .3s;
  background:radial-gradient(200px 130px at var(--mx,30%) var(--my,0%),rgba(255,255,255,.34),transparent 72%);
}
.nav,.box,.mode,.lrow{position:relative}
.me:hover::before,.hcard:hover::before,.card:hover::before,.bar:hover::before,.rrow:hover::before,.scrub:hover::before,.btn:hover::before,.opt:hover::before,.pad:hover::before,.nav:hover::before,.box:hover::before,.mode:hover::before,.lrow:hover::before{opacity:1}
.sheet::before,.rcard::before{background:radial-gradient(520px 340px at var(--mx,50%) var(--my,0%),rgba(255,255,255,.1),transparent 70%)}
.sheet:hover::before,.rcard:hover::before{opacity:1}
/* slow sheen sweep on the big tiles, so the glass feels alive even without a pointer */
.hcard::after,.opt::after{content:"";position:absolute;inset:-30% auto -30% -45%;width:32%;transform:skewX(-20deg) translateX(-160%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);pointer-events:none;border-radius:inherit;animation:sheen 7s ease-in-out infinite}
.opt:nth-child(2)::after{animation-delay:1.2s}.opt:nth-child(3)::after{animation-delay:2.4s}.opt:nth-child(4)::after{animation-delay:3.6s}
#heroQuick::after{animation-delay:3.2s}
@keyframes sheen{0%,62%{transform:skewX(-20deg) translateX(-160%)}100%{transform:skewX(-20deg) translateX(520%)}}

/* ---------- top bar ---------- */
.top{padding:20px 28px}
.logo{font-size:32px;font-weight:900;letter-spacing:.04em}
.logo b{background:var(--grad) 0 0/220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s ease-in-out infinite alternate}
.logo small{font-weight:700}
.logo{line-height:0}
.logo img{display:block;height:54px;width:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}
.me{border-radius:999px;font-weight:700}
@keyframes flow{to{background-position:100% 0}}

/* ---------- lobby: big type + color blocks ---------- */
.wrapped{position:relative;padding:6px 2px 30px}
.kicker{margin:0 0 4px;font:800 13px var(--num);letter-spacing:.3em;color:var(--sky)}
.mega{margin:0;font:900 clamp(54px,10.6vw,160px)/1 "Noto Sans TC",var(--num);letter-spacing:-.035em;color:#fff;text-shadow:0 10px 60px rgba(108,197,214,.25)}
.mega em{font-style:normal;display:inline-block;padding:0 .08em 0 .04em;background:var(--grad) 0 0/220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 7s ease-in-out infinite alternate}
.ticker{margin:24px -70px 0;overflow:hidden;transform:rotate(-1.3deg);border-block:3px solid var(--ink);box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.tk{display:flex;width:max-content;animation:tick 30s linear infinite}
.tk span{flex:none;padding:13px 38px;font:900 clamp(18px,2.3vw,30px)/1 "Noto Sans TC";color:var(--ink);letter-spacing:.08em;white-space:nowrap}
.tk span:nth-child(3n+1){background:var(--sky)}
.tk span:nth-child(3n+2){background:var(--lime)}
.tk span:nth-child(3n){background:var(--amber)}
@keyframes tick{to{transform:translateX(-50%)}}

.hero{background:none;border:0;padding:0;gap:18px}
.hcard{--hc:var(--sky);min-height:120px;border-radius:30px;gap:20px;padding:22px 28px;overflow:hidden;transition:transform .3s var(--ease-pop),box-shadow .3s,border-color .3s}
#heroQuick{--hc:var(--amber)}
#heroCreate,#heroQuick{
  background:linear-gradient(135deg,color-mix(in srgb,var(--hc) 40%,transparent),color-mix(in srgb,var(--hc) 9%,transparent) 62%),var(--g-bg);
  border-color:color-mix(in srgb,var(--hc) 55%,rgba(255,255,255,.3));
  box-shadow:var(--g-edge),0 22px 50px -18px color-mix(in srgb,var(--hc) 60%,transparent);
}
#heroCreate:hover,#heroQuick:hover{transform:translateY(-4px) scale(1.01);background:linear-gradient(135deg,color-mix(in srgb,var(--hc) 52%,transparent),color-mix(in srgb,var(--hc) 14%,transparent) 62%),var(--g-bg)}
#heroCreate:active,#heroQuick:active{transform:scale(.975,.96)}
.hcard .ic{width:68px;height:68px;font-size:28px;border:0;color:var(--ink);background:var(--hc);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 12px 26px -8px var(--hc)}
.hcard.on .ic{color:var(--ink);border:0}
.hcard b{font-size:clamp(20px,2.2vw,28px);font-weight:900;letter-spacing:.01em}
.hcard span{color:rgba(255,255,255,.72)}
.hcard .ic{font-size:28px}

.lib{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:34px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.side{border-right-color:rgba(255,255,255,.1)}
.nav{border-radius:18px;font-weight:700;transition:background .25s,transform .25s var(--ease-pop)}
.nav.on{background:linear-gradient(135deg,rgba(108,197,214,.32),rgba(255,255,255,.07));border-color:rgba(255,255,255,.3);box-shadow:var(--g-edge)}
.nav:active{transform:scale(.97)}
.cta{border:1px dashed rgba(255,178,63,.55);border-radius:20px;background:rgba(255,178,63,.06)}
.cta code{background:rgba(255,255,255,.1);color:#fff}
.bar{border-radius:24px;padding:10px 12px}
.search{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);box-shadow:inset 0 2px 8px rgba(0,0,0,.25)}
.chip{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.06);font-weight:700}
.seg{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18)}
.seg button.on,.tabs button.on{background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.1));box-shadow:var(--g-edge)}

/* library cards: each one takes the next brand color */
.card{--cc:var(--sky);border-radius:26px;transition:transform .35s var(--ease-pop),box-shadow .3s,border-color .3s}
.card:nth-child(3n+2){--cc:var(--lime)}
.card:nth-child(3n){--cc:var(--amber)}
.card:hover{transform:translateY(-6px) scale(1.015);border-color:color-mix(in srgb,var(--cc) 75%,#fff 10%);box-shadow:var(--g-edge),0 26px 54px -16px color-mix(in srgb,var(--cc) 65%,transparent)}
.card:active{transform:scale(.985)}
.cv:after{background:linear-gradient(180deg,rgba(7,11,20,.2),transparent 40%,rgba(7,11,20,.55))}
.cv img{filter:saturate(1.08)}
.tag{background:var(--cc,var(--sky));color:var(--ink);font-weight:800;border:0;backdrop-filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.cb h3{font-size:19px;font-weight:900}
.stats .i{color:var(--cc)}
.meta .star{color:var(--amber)}
.grid.rows .card{border-radius:24px}

/* ---------- buttons ---------- */
.btn{border-radius:18px;font-weight:800;transition:transform .22s var(--ease-pop),box-shadow .25s,filter .2s,border-color .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(255,255,255,.45)}
.btn:active:not(:disabled){transform:scale(.96,.93)}
.btn.sm{border-radius:14px}
.btn.pri{border:0;color:var(--ink);font-weight:900;background:linear-gradient(100deg,#6cc5d6,#8cc63f 50%,#ffb23f) 0 0/220% 100%;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 14px 36px -10px rgba(140,198,63,.6);animation:flow 6s ease-in-out infinite alternate}
.btn.pri:hover:not(:disabled){filter:brightness(1.07) saturate(1.1)}
.btn.danger{color:#ffb3bd;border-color:rgba(255,107,125,.5)}
.btn.warn{color:#ffd48a;border-color:rgba(255,178,63,.55)}
.btn.info{color:#a9e4f1;border-color:rgba(108,197,214,.55)}
.btn.danger.armed{background:#e0364f;border-color:#ff8b9b;color:#fff}
kbd{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:rgba(255,255,255,.8)}

/* ---------- modal sheet ---------- */
.modal{background:rgba(4,8,16,.5);-webkit-backdrop-filter:none;backdrop-filter:none}
.sheet{background:linear-gradient(180deg,rgba(26,42,66,.68),rgba(10,16,28,.86));-webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);border-left:1px solid rgba(255,255,255,.24);border-radius:34px 0 0 34px;box-shadow:var(--g-edge),-30px 0 90px rgba(0,0,0,.5)}
.mh{border-bottom-color:rgba(255,255,255,.12)}
.mh h2{font-size:clamp(22px,2.4vw,32px);font-weight:900}
.mh .x{background:rgba(255,255,255,.08)}
.mf{background:rgba(255,255,255,.04);border-top-color:rgba(255,255,255,.12)}
.mb>div+div{border-left-color:rgba(255,255,255,.12)}
.setup aside{border-right-color:rgba(255,255,255,.12)}
.tabs{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16)}
.badge{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.mbox,.lrow,.box,.mode,.opt3,.prow,.note,.field,.addp,.quick button,.stepper button.rd{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.mode.on{border-color:rgba(108,197,214,.75);background:linear-gradient(135deg,rgba(108,197,214,.34),rgba(255,255,255,.06))}
.mode.on .ic{background:var(--sky);color:var(--ink)}
.opt3.on{border-color:rgba(255,178,63,.8);background:linear-gradient(135deg,rgba(255,178,63,.3),rgba(255,255,255,.05))}
.quick button.on{border-color:var(--lime);background:rgba(140,198,63,.22);color:#fff}
.stepper .v{font-weight:900;font-size:46px;letter-spacing:-.02em}
.rangev{font-weight:900;font-size:32px}
input[type=range]{accent-color:var(--lime)}
.field:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(108,197,214,.25)}
.lrow.mine{box-shadow:inset 3px 0 0 var(--sky)}
.sh .i,.dstats .i{color:var(--sky)}

/* ---------- game: one thing at a time, big and loud ---------- */
.game{--k:var(--sky);--k2:#9ee2ef;gap:30px}
.game[data-k="1"]{--k:var(--lime);--k2:#c3e984}
.game[data-k="2"]{--k:var(--amber);--k2:#ffd78e}
.arena{gap:22px}
.ahead h1{font-size:clamp(28px,3.6vw,50px);font-weight:900;letter-spacing:-.02em;line-height:1.1}
.ahead h1 small{font-weight:700;letter-spacing:.04em;margin-top:4px}
.stage{height:clamp(260px,42vh,600px);border-radius:36px;border:1px solid rgba(255,255,255,.26);box-shadow:var(--g-edge),0 44px 100px -34px color-mix(in srgb,var(--k) 70%,transparent);transition:box-shadow .6s}

.cover{--ink:#07141b;color:var(--ink);overflow:hidden;gap:clamp(10px,2vh,22px);background:linear-gradient(150deg,var(--k2),var(--k) 72%)}
.cover>*{position:relative;z-index:1}
/* concentric arcs: a nod to the logo */
.cover::before{content:"";position:absolute;right:-16%;bottom:-70%;width:96%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,transparent 0 33%,rgba(255,255,255,.3) 33.5% 46%,transparent 46.5% 53%,rgba(255,255,255,.22) 53.5% 66%,transparent 66.5% 73%,rgba(255,255,255,.14) 73.5% 86%,transparent 86.5%);
  animation:arcs 18s linear infinite}
@keyframes arcs{to{transform:rotate(360deg)}}
.cover::after{content:"";position:absolute;inset:-20% auto -20% -45%;width:30%;transform:skewX(-18deg) translateX(-160%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);pointer-events:none;opacity:0}
.cover.swapin::after{animation:shine .95s .04s cubic-bezier(.3,.7,.2,1)}
@keyframes shine{0%{opacity:1;transform:skewX(-18deg) translateX(-160%)}100%{opacity:1;transform:skewX(-18deg) translateX(460%)}}
.cover.swapin>*{animation:blockpop .6s var(--ease-pop) both}
.cover.swapin>*:nth-child(2){animation-delay:.07s}
.cover.swapin>*:nth-child(3){animation-delay:.14s}
.cover.swapin>*:nth-child(4){animation-delay:.21s}
@keyframes blockpop{from{opacity:0;transform:translateY(28px) scale(.84)}}
.cover .pill{color:var(--ink);background:rgba(255,255,255,.32);border:2px solid var(--ink);font:900 18px var(--num);letter-spacing:.1em;padding:6px 20px}
.cover .cnt{color:var(--ink);background:rgba(255,255,255,.3);border:2px solid rgba(7,20,27,.5);font-weight:800}
.singT{font-weight:900;font-size:clamp(34px,min(6.4vw,10.5vh),96px);line-height:1.04;letter-spacing:-.015em}
/* sing mode: the countdown moves to a small badge in the corner so long titles keep their room */
.cover .mini{position:absolute;top:16px;right:20px;transform:scale(.42);transform-origin:top right;margin:0}
.singA{color:rgba(7,20,27,.82);font-weight:800}
.singH{color:rgba(7,20,27,.74);font-weight:700}
.buzzN{color:var(--ink);background:var(--c);border:3px solid var(--ink);padding:.06em .6em;border-radius:999px;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 16px 34px -10px rgba(7,20,27,.55)}
.cover.peek{color:#fff}
.cover.peek::before,.cover.peek::after{display:none}
.cover.peek .singT,.cover.peek .singA{color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.65)}
.tap{background:rgba(7,11,20,.5)}

.ringw{width:min(230px,25vh);height:min(230px,25vh)}
.ringw b{font:900 clamp(64px,13.5vh,150px)/1 var(--num);letter-spacing:-.05em;color:var(--ink)}
.ring{filter:none}
.ring circle{stroke-width:10}
.ring .trk{stroke:rgba(7,20,27,.16)}
.ring .arc{stroke:var(--ink)}
.ringw.hot .ring{filter:none}
.ringw.hot .arc{stroke:#d61f45}
.ringw.hot b{color:#d61f45;animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

.sctl.l,.sctl.r{border-color:rgba(255,255,255,.3);background:linear-gradient(135deg,rgba(7,20,27,.66),rgba(7,20,27,.46));color:#fff}
.sctl.l button{color:rgba(255,255,255,.8)}
.sctl.l button.on{background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.1));box-shadow:var(--g-edge);color:#fff}
.nextbar{height:6px}
.nextbar i{background:var(--grad)}

/* answers: four liquid glass tiles, one brand color each */
.opts{gap:20px}
.opt{--oc:var(--sky);min-height:clamp(84px,11vh,128px);border-radius:30px;padding:18px 30px 18px 20px;gap:18px;overflow:hidden;
  font-size:clamp(18px,2.1vw,32px);font-weight:800;line-height:1.25;border:1px solid rgba(255,255,255,.34);
  background:linear-gradient(135deg,color-mix(in srgb,var(--oc) 50%,rgba(255,255,255,.1)),color-mix(in srgb,var(--oc) 15%,rgba(255,255,255,.03)) 72%);
  box-shadow:var(--g-edge),0 18px 38px -16px color-mix(in srgb,var(--oc) 70%,transparent);
  transition:transform .28s var(--ease-pop),box-shadow .25s,border-color .2s,background .3s,filter .3s,opacity .3s}
.opt:nth-child(2){--oc:var(--lime)}
.opt:nth-child(3){--oc:var(--amber)}
.opt:nth-child(4){--oc:#cfe3f2}
.opt:hover:not(:disabled){transform:translateY(-5px) scale(1.015);border-color:rgba(255,255,255,.7)}
.opt:active:not(:disabled){transform:scale(.965,.94)}
.opt kbd{order:-1;display:grid;place-items:center;width:42px;height:42px;flex:none;border:0;border-radius:50%;background:var(--oc);color:var(--ink);font:900 17px var(--num);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 8px 18px -6px var(--oc)}
.opt .ot,.opt kbd,.opt .mk{position:relative;z-index:1}
.opt .mk{width:40px;height:40px;font-size:22px;font-weight:900}
.opt.pick{border-color:#fff;box-shadow:var(--g-edge),0 0 0 3px rgba(255,255,255,.45)}
.opt.right{color:var(--ink);border-color:#fff;background:linear-gradient(135deg,#c6ed7c,#8cc63f 75%);box-shadow:var(--g-edge),0 0 0 4px rgba(255,255,255,.55),0 26px 70px -12px rgba(140,198,63,.85);animation:jelly .65s var(--ease-pop)}
.opt.right kbd{background:var(--ink);color:#fff;box-shadow:none}
.opt.right .mk{background:var(--ink);color:var(--lime)}
.opt.wrong{color:#fff;border-color:rgba(255,255,255,.7);background:linear-gradient(135deg,#ff8f9f,#e8405a 78%);box-shadow:var(--g-edge),0 22px 56px -14px rgba(232,64,90,.8);animation:wobble .5s}
.opt.wrong kbd{background:#fff;color:#c4223d;box-shadow:none}
.opt.wrong .mk{background:#fff;color:#c4223d}
.opt.fade{opacity:.34;filter:saturate(.4)}
@keyframes jelly{0%{transform:scale(1)}28%{transform:scale(1.07,.93)}52%{transform:scale(.96,1.05)}76%{transform:scale(1.02,.99)}100%{transform:scale(1)}}
@keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.judge .ok{background:linear-gradient(135deg,rgba(198,237,124,.95),rgba(140,198,63,.75));color:var(--ink);border-color:rgba(255,255,255,.55)}
.judge .ng{background:linear-gradient(135deg,rgba(255,143,159,.9),rgba(232,64,90,.75));color:#fff;border-color:rgba(255,255,255,.5)}
.judge .btn{border-radius:22px;font-weight:900}

/* scoreboard */
.rank h4{font:800 12px var(--num);letter-spacing:.2em;color:var(--mute)}
.rrow{border-radius:22px;padding:14px 16px}
.rrow .sc{font-size:28px;font-weight:900;letter-spacing:-.02em}
.rrow .sc i{font-size:14px;font-weight:800}
.rrow .you{border-color:var(--k);color:var(--k);font-weight:800}
.rrow.me{background:linear-gradient(135deg,color-mix(in srgb,var(--k) 42%,transparent),rgba(255,255,255,.07));border-color:color-mix(in srgb,var(--k) 75%,#fff 10%);box-shadow:var(--g-edge),0 18px 40px -16px color-mix(in srgb,var(--k) 70%,transparent)}
.rrow.lead{background:linear-gradient(135deg,rgba(255,178,63,.32),rgba(255,255,255,.06));border-color:rgba(255,178,63,.65)}
.rrow.ghost{opacity:.6}

/* score pop */
.pop{border-radius:30px;background:linear-gradient(135deg,rgba(255,178,63,.4),rgba(255,255,255,.08));border-color:rgba(255,255,255,.4)}
.pop.no{background:linear-gradient(135deg,rgba(255,107,125,.45),rgba(255,255,255,.07));border-color:rgba(255,255,255,.4)}
.pop .big{font-size:86px;font-weight:900;color:#fff;letter-spacing:-.03em;text-shadow:0 0 40px rgba(255,178,63,.7)}
.pop .sub{font-weight:900}

/* sing pads: player color blocks */
.pad{border-radius:32px;border:2px solid color-mix(in srgb,var(--c) 80%,#fff 20%);
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 55%,rgba(255,255,255,.08)),color-mix(in srgb,var(--c) 16%,rgba(255,255,255,.03)) 82%);
  box-shadow:var(--g-edge),0 20px 44px -18px var(--c);overflow:hidden}
.pad b{font-size:22px;font-weight:900;color:#fff;position:relative;z-index:1}
.pad .ps{font-size:clamp(40px,4.4vw,66px);font-weight:900;color:#fff;letter-spacing:-.03em;text-shadow:0 2px 24px color-mix(in srgb,var(--c) 75%,transparent);position:relative;z-index:1}
.pad.buzz{animation:jelly .6s var(--ease-pop);box-shadow:var(--g-edge),0 0 70px var(--c)}

/* result */
.result{background:radial-gradient(80% 60% at 50% 30%,rgba(7,11,20,.5),rgba(3,6,12,.86));-webkit-backdrop-filter:none;backdrop-filter:none}
.rcard{border-radius:42px;border:1px solid rgba(255,255,255,.32);background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 55%,rgba(255,255,255,.1));-webkit-backdrop-filter:blur(38px) saturate(1.8);backdrop-filter:blur(38px) saturate(1.8);box-shadow:var(--g-edge),0 44px 110px rgba(0,0,0,.6)}
.rcard h2{font-weight:800;letter-spacing:.2em}
.rbig{font-size:clamp(110px,18vw,208px);font-weight:900;letter-spacing:-.05em;line-height:.95;background:var(--grad) 0 0/220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s ease-in-out infinite alternate}
.rgrid div{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.rgrid b{font-size:26px;font-weight:900}
.rcard::after{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,transparent 0 30%,rgba(108,197,214,.4) 30.5% 44%,transparent 44.5% 52%,rgba(140,198,63,.34) 52.5% 66%,transparent 66.5% 74%,rgba(255,178,63,.3) 74.5% 88%,transparent 88.5%);opacity:.8}
.rcard>*{position:relative;z-index:1}
.rlist li{border-bottom-color:rgba(255,255,255,.12)}
.podium .lrow .sc{color:var(--c)}

.toast{background:linear-gradient(135deg,rgba(40,58,88,.75),rgba(14,22,36,.8));border-color:rgba(255,255,255,.3);border-radius:20px;font-weight:700}
.scrub{border-radius:22px}
.scrub button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.empty{border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.035)}

/* ---------- small screens ---------- */
@media (max-width:860px){
  .top{padding:14px 16px}
  .logo{font-size:26px}
  .logo img{height:44px}
  .wrapped{padding:2px 0 22px}
  .mega{font-size:clamp(46px,15vw,84px)}
  .ticker{margin:18px -40px 0}
  .tk span{padding:11px 26px}
  .hcard{min-height:96px;padding:16px 18px;border-radius:26px}
  .hcard .ic{width:56px;height:56px;font-size:24px}
  .lib{border-radius:28px}
  .stage{border-radius:28px;height:clamp(220px,40vh,420px)}
  .ahead h1{font-size:24px}
  .ringw{width:150px;height:150px}
  .ringw b{font-size:78px}
  .cover .mini{right:auto;left:14px;top:14px;transform-origin:top left}
  .opts{gap:10px}
  .opt{min-height:92px;padding:12px 14px 12px 12px;gap:10px;font-size:16px;border-radius:24px}
  .opt kbd{display:none}
  .opt .mk{width:34px;height:34px;font-size:18px}
  .pop .big{font-size:56px}
  .rbig{font-size:clamp(84px,26vw,130px)}
  .rcard{border-radius:32px}
  .pad{border-radius:24px}
  .pad .ps{font-size:36px}
  .sheet{border-radius:0}
}
/* short laptop screens: keep the whole question (stage + 4 answers) in one view */
@media (min-width:861px) and (max-height:820px){
  .top{padding:12px 28px}
  .ahead h1{font-size:clamp(26px,3vw,38px)}
  .arena{gap:16px}
  .stage{height:clamp(230px,40vh,600px)}
  .ringw{width:min(230px,21vh);height:min(230px,21vh)}
  .ringw b{font-size:clamp(56px,11vh,150px)}
  .cover .pill{padding:4px 16px;font-size:16px}
  .opts{gap:14px}
  .opt{min-height:76px;padding:12px 24px 12px 14px;gap:14px;font-size:clamp(17px,1.65vw,26px);border-radius:24px}
  .opt kbd{width:36px;height:36px}
  .judge .btn{height:56px}
}
@media (max-width:480px){
  .ticker{margin-left:-30px;margin-right:-30px}
}

/* ---------- accessibility / fallbacks ---------- */
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){

/* <<< theme layer */

/* ---- online room: lobby entry, host panel, phone controller (built from the theme layer's own pieces) ---- */
.topr{display:flex;align-items:center;gap:10px;min-width:0}

.topr .chip .i{width:18px;height:18px}
.topr .chip.roomtop{border-color:rgba(140,198,63,.75);background:linear-gradient(135deg,rgba(140,198,63,.34),rgba(255,255,255,.06))}
@media (max-width:860px){.topr .chip span:not([data-i]):not(#roomTopT){display:none}.topr .chip{padding:0 13px}.topr{gap:8px}}

/* third hero card: "跟朋友玩" (lime, same recipe as the other two) */
@media (min-width:861px){.hero{grid-template-columns:1.25fr 1.25fr 1fr}}

#heroParty:hover{transform:translateY(-4px) scale(1.01);background:linear-gradient(135deg,color-mix(in srgb,var(--hc) 52%,transparent),color-mix(in srgb,var(--hc) 14%,transparent) 62%),var(--g-bg)}

#heroParty::after{animation-delay:1.6s}

/* room panel (setup sheet, "跟朋友玩" sheet, room popup) */
.roombox{position:relative;border:1px solid rgba(255,255,255,.2);border-radius:26px;padding:18px 20px;background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.roombox .rtop{display:flex;align-items:center;justify-content:space-between;gap:16px}
.roombox .k{font:800 12px var(--num);letter-spacing:.3em;color:var(--sky)}
.roombox .code{margin-top:2px;font:900 clamp(60px,9vw,88px)/1 var(--num);letter-spacing:.1em;background:var(--grad) 0 0/220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 7s ease-in-out infinite alternate}
.roombox canvas.qr{width:136px;height:136px;flex:none;border-radius:20px;background:#fff;image-rendering:pixelated;box-shadow:0 16px 36px -14px rgba(0,0,0,.6)}
.roombox .url{display:flex;gap:8px;margin-top:14px}
.roombox .url input{flex:1;min-width:0;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);padding:0 14px;color:var(--mute);font-size:13px}
.roombox .hintp{color:var(--mute);font-size:13px;margin:12px 0 0;line-height:1.6}
.guests{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.gchip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border:1px solid color-mix(in srgb,var(--c) 70%,#fff 10%);border-radius:999px;font-weight:800;font-size:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 32%,transparent),rgba(255,255,255,.05))}
.gchip i{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.gchip.off{opacity:.4}
@media (max-width:480px){.roombox .rtop{flex-direction:column-reverse;align-items:flex-start}.roombox canvas.qr{width:168px;height:168px}}

/* a phone player's pad on the host screen: an indicator, not a button */
.pad.remote{pointer-events:none}
.pad .rt{position:absolute;top:12px;right:14px;display:flex;align-items:center;gap:6px;font:800 11px var(--num);letter-spacing:.08em;color:#fff;opacity:.9}
.pad .rt::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime)}
.pad.remote.off{opacity:.38;filter:grayscale(.7)}
.pad.remote.off .rt::before{background:var(--dim);box-shadow:none}
.judge .hint{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:8px 14px}

/* phone controller (?room=): the same glass + color blocks as the host screen */
.ctl{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;gap:14px;width:min(100%,560px);margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto;--k:var(--sky);--k2:#9ee2ef}
.ctl[hidden]{display:none}
.ctl .ctop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ctl .logo{font-size:26px}
.ctl .logo img{height:40px}
.ctl .st{font-size:12.5px;font-weight:800;color:var(--mute);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 12px;background:rgba(255,255,255,.06);white-space:nowrap}
.ctl .st.ok{color:#d9f3a8;border-color:rgba(140,198,63,.6)}
.ctl .st.bad{color:#ffb3bd;border-color:rgba(255,107,125,.55)}
.cjoin{margin:auto 0;display:flex;flex-direction:column;gap:14px;width:100%}

.cjoin #cCode{font:900 30px var(--num);letter-spacing:.3em;text-align:center}
.cjoin .btn{height:60px;font-size:19px;border-radius:20px}
.cnote{margin:0;text-align:center;color:var(--mute);font-size:14px;line-height:1.6}
.cblk{position:relative;overflow:hidden;border-radius:30px;padding:18px 18px 20px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--ink);background:linear-gradient(150deg,var(--k2),var(--k) 72%);border:1px solid rgba(255,255,255,.34);box-shadow:var(--g-edge),0 30px 70px -30px color-mix(in srgb,var(--k) 70%,transparent);transition:background .4s}
.cblk::before{content:"";position:absolute;right:-18%;bottom:-80%;width:100%;aspect-ratio:1;border-radius:50%;pointer-events:none;background:radial-gradient(circle,transparent 0 33%,rgba(255,255,255,.3) 33.5% 46%,transparent 46.5% 53%,rgba(255,255,255,.22) 53.5% 66%,transparent 66.5% 73%,rgba(255,255,255,.14) 73.5% 86%,transparent 86.5%);animation:arcs 18s linear infinite}
.cblk>*{position:relative;z-index:1}
.cblk .pill{color:var(--ink);background:rgba(255,255,255,.32);border:2px solid var(--ink);font:900 15px var(--num);letter-spacing:.1em;padding:4px 16px}
.cblk .t{font:900 clamp(30px,10vw,46px)/1.08 "Noto Sans TC",var(--num);letter-spacing:-.015em;word-break:break-word}
.cblk .a{color:rgba(7,20,27,.82);font-weight:800}
.cblk .s{color:rgba(7,20,27,.76);font-weight:700;font-size:14px}
.cblk .cring .ringw{width:104px;height:104px}
.cblk .cring .ringw b{font-size:46px}
.ctl .cpad{flex:1;min-height:200px;max-height:none;gap:6px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;border-radius:34px}
.ctl .cpad .big{font:900 clamp(40px,13vw,64px)/1.05 "Noto Sans TC",var(--num);color:#fff;letter-spacing:-.02em;text-shadow:0 2px 24px color-mix(in srgb,var(--c) 75%,transparent);position:relative;z-index:1}
.ctl .cpad small{color:rgba(255,255,255,.88);font-weight:700;position:relative;z-index:1}
.ctl .cpad:disabled{opacity:.42;filter:grayscale(.55)}
.ctl .cpad.mine{animation:jelly .6s var(--ease-pop);box-shadow:var(--g-edge),0 0 70px var(--c)}
.ctl .judge{gap:12px;padding:0;flex-wrap:nowrap}
.ctl .judge .btn{height:92px;font-size:24px;max-width:none}
.ctl .judge .btn.on{outline:3px solid #fff;outline-offset:2px}
.ctl .opts{grid-template-columns:1fr;gap:10px}
.ctl .opt{min-height:78px;padding:12px 16px 12px 14px;font-size:17px;border-radius:24px}
.ctl .opt:disabled{cursor:default}
.pop.board{left:50%;transform:translate(-50%,-50%);width:min(92%,520px);padding:18px 20px;display:flex;flex-direction:column;gap:8px;background:var(--g-bg);border-color:rgba(255,255,255,.3);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
.pop.board h4{margin:0 0 4px;font:900 15px var(--num);letter-spacing:.2em;color:var(--sky);display:flex;align-items:center;gap:8px}
.pop.board .rrow{flex:none;padding:10px 14px}
.mv{font:900 13px var(--num);min-width:34px;text-align:center;color:var(--dim)}
.mv.up{color:var(--lime)}.mv.dn{color:#ff8f9f}
.ctl .crank{display:flex;flex-direction:column;gap:8px}
.ctl .rrow{flex:none;padding:10px 14px}

/* ---- first place: tilted crown on the avatar + golden glow over the whole block ---- */
.rrow.first{border-color:rgba(255,222,120,.9);background:linear-gradient(135deg,rgba(255,196,64,.42),rgba(255,236,170,.12) 55%,rgba(255,196,64,.22));
  box-shadow:var(--g-edge),0 0 0 1px rgba(255,214,102,.35),0 0 24px 2px rgba(255,196,64,.5),0 14px 44px -12px rgba(255,178,63,.7);animation:goldPulse 2.4s ease-in-out infinite}
.rrow.first::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:linear-gradient(105deg,transparent 32%,rgba(255,244,200,.55) 50%,transparent 68%) -150% 0/60% 100% no-repeat;animation:goldSweep 3.2s ease-in-out infinite}
.rrow.first>*{position:relative;z-index:1}
.rrow.first .av{box-shadow:0 0 0 2px rgba(255,226,140,.95),0 0 16px rgba(255,200,70,.95)}
.rrow.first .sc{text-shadow:0 0 14px rgba(255,200,70,.9)}
.crown{position:absolute;left:-14px;top:-18px;width:26px;height:22px;transform:rotate(-28deg);transform-origin:70% 100%;pointer-events:none;z-index:3;
  filter:drop-shadow(0 0 5px rgba(255,200,70,.95)) drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.crown.drop{animation:crownDrop .75s cubic-bezier(.2,1.3,.4,1) both}
@keyframes goldPulse{
  0%,100%{box-shadow:var(--g-edge),0 0 0 1px rgba(255,214,102,.35),0 0 20px 1px rgba(255,196,64,.42),0 14px 40px -12px rgba(255,178,63,.6)}

@keyframes goldSweep{0%,35%{background-position:-150% 0}70%,100%{background-position:250% 0}}
@keyframes crownDrop{0%{transform:translateY(-26px) rotate(-75deg) scale(.2);opacity:0}60%{transform:translateY(2px) rotate(-22deg) scale(1.2);opacity:1}100%{transform:rotate(-28deg) scale(1);opacity:1}}
@media (max-width:860px){.rank{padding:14px 6px 12px;margin-top:-6px}}   /* the row list scrolls sideways, so leave room for the crown and glow */
@media (prefers-reduced-motion:reduce){.rrow.first,.rrow.first::after,.crown.drop{animation:none}}

<body>

<!-- drifting color blobs behind the glass -->
<div class="aura" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<header class="top" id="topbar">

  <button class="me" id="meBtn" aria-label="改暱稱"><span class="av" id="meAv">玩</span><span id="meName">玩家</span><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button></div>

<!-- ================= LOBBY ================= -->
<main class="lobby" id="lobby">

  </section>
  <div class="hero">
    <button class="hcard on" id="heroCreate"><span class="ic" data-i="plus"></span><div><b>選題庫開始</b><span>點下方任一題庫，選「四選一」或「搶唱派對」</span></div></button>
    <button class="hcard" id="heroParty"><span class="ic" data-i="users"></span><div><b>跟朋友玩</b><span>開房間，朋友用手機加入</span></div></button>

const fx = $("#fx"), fctx = fx.getContext("2d"); let parts = [], fxOn = false;
function confetti(colors, n = 120){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio;
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth * (.3 + Math.random() * .4), y: innerHeight * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 4, r: Math.random() * 6 + 3, c: colors[i % colors.length], a: Math.random() * 6, life: 1 });
  if (!fxOn) { fxOn = true; requestAnimationFrame(stepFx); }
}
function stepFx(){
  const d = devicePixelRatio; fctx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.life > 0);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.vx *= .99; p.a += .2; p.life -= .011;
    fctx.save(); fctx.globalAlpha = Math.max(0, p.life); fctx.translate(p.x * d, p.y * d); fctx.rotate(p.a); fctx.fillStyle = p.c; fctx.fillRect(-p.r * d / 2, -p.r * d / 4, p.r * d, p.r * d / 2); fctx.restore(); });
  if (parts.length) requestAnimationFrame(stepFx); else { fxOn = false; fctx.clearRect(0, 0, fx.width, fx.height); }
}

/* ================= YouTube players =================
   Two players are used so the next song can be buffered (muted, paused) in the standby
   one while the current song is still being revealed; swapping then starts it instantly. */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const YTP = {
  ps: [null, null], rdy: [false, false], a: 0, volume: 60,
  ready: false, failed: false, waiters: [], pre: null, plErr: 0, plWatch: false,
  whenReady(){ return this.ready ? Promise.resolve() : new Promise(r => this.waiters.push(r)); },
  callOn(i, fn, ...a){ try { const p = this.ps[i]; return p && p[fn] ? p[fn](...a) : undefined; } catch (e) { console.warn(e); } },
  call(fn, ...a){ return this.callOn(this.a, fn, ...a); },
  /* always START muted (browsers allow that without a tap) and turn the sound on once it is really playing */
  load(v, s){ this.call("mute"); this.call("loadVideoById", { videoId: v, startSeconds: s }); },
  cue(v, s){ this.call("cueVideoById", { videoId: v, startSeconds: s }); },
  play(){ this.call("playVideo"); }, pause(){ this.call("pauseVideo"); }, stop(){ this.call("stopVideo"); },
  stopAll(){ this.callOn(0, "stopVideo"); this.callOn(1, "stopVideo"); this.pre = null; },
  seek(s){ this.call("seekTo", s, true); },
  vol(v){ this.volume = v; this.call("setVolume", v); this.call(v > 0 ? "unMute" : "mute"); },
  state(){ const s = this.call("getPlayerState"); return s == null ? -1 : s; },
  time(){ const t = this.call("getCurrentTime"); return typeof t === "number" && isFinite(t) ? t : 0; },
  dur(){ const d = this.call("getDuration"); return typeof d === "number" && isFinite(d) ? d : 0; },
  front(i){ $("#slot0").classList.toggle("front", i === 0); $("#slot1").classList.toggle("front", i === 1); },
  /* buffer the next song in the standby player: muted, starts, then is paused as soon as it plays */
  preload(v, s){
    if (!this.ready) return;
    if (this.pre && this.pre.v === v && this.pre.start === s) return;
    const i = 1 - this.a;
    this.pre = { v, start: s, idx: i, ready: false };
    this.callOn(i, "mute");
    this.callOn(i, "loadVideoById", { videoId: v, startSeconds: s });
  },
  /* start song v at s; instant when it was preloaded, otherwise a normal load */
  take(v, s){
    const p = this.pre;
    if (p && p.v === v && p.start === s) {          // ready, or still buffering: either way don't download it a second time
      const old = this.a;
      this.a = p.idx; this.pre = null;
      this.callOn(old, "pauseVideo");
      this.front(this.a);
      this.callOn(this.a, "setVolume", this.volume);
      this.callOn(this.a, "mute");                     // sound comes on in onYTState, once it is really playing
      if (p.ready) this.callOn(this.a, "seekTo", s, true);
      this.callOn(this.a, "playVideo");
      return p.ready;
    }
    this.pre = null;
    this.load(v, s);
    return false;
  }
};

/* The first open slides the sheet in. Moving between steps (detail → settings) keeps the sheet and
   only swaps its contents, so nothing re-slides; a "quiet" update (stepper clicks) swaps with no motion at all. */
function openModal(html, narrow){

    sh.innerHTML = html;

  } else {
    closing = false; modal.classList.remove("out");
    modal.innerHTML = `<div class="sheet${narrow ? " narrow" : ""}" role="dialog" aria-modal="true">${html}</div>`;
    modal.hidden = false;

  $$("[data-close]", modal).forEach(b => b.onclick = closeModal);
}

  if (!modalOpen()) return;

/* ---- my libraries: paste YouTube links ---- */
const YT_ID = /(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})(?![\w-])/;
const YT_LIST = /[?&]list=([\w-]+)/;
let cbN = 0;
function jsonp(url){
  return new Promise((res, rej) => {
    const name = "ytcb" + (++cbN) + "_" + (Math.random() * 1e6 | 0);
    const s = document.createElement("script");
    const t = setTimeout(() => { done(); rej(new Error("timeout")); }, 8000);
    function done(){ clearTimeout(t); delete window[name]; s.remove(); }
    window[name] = d => { done(); res(d); };
    s.onerror = () => { done(); rej(new Error("script")); };
    s.src = url + "&callback=" + name; document.head.appendChild(s);
  });
}
function guessSong(vt, ch){
  const s = String(vt || "").replace(/[\(\[（【][^\)\]）】]*[\)\]）】]/g, " ").replace(/\s+/g, " ").trim();
  const chName = String(ch || "").replace(/\s*-\s*Topic$/i, "").replace(/VEVO$/i, "").trim();
  const q = String(vt || "").match(/[《「『](.+?)[》」』]/);
  if (q) return { title: q[1].trim(), artist: String(vt).split(/[《「『【]/)[0].replace(/[\s\-–—|｜:：]+$/, "").trim() || chName };
  const p = s.split(/\s+[-–—|｜]\s+/);
  if (p.length >= 2) return { artist: p[0].trim(), title: p[1].trim() };
  return { title: s || vt, artist: chName };
}

/* Read every video id of a playlist through the YouTube player itself (no API key needed). */
async function readPlaylist(id){
  try { await Promise.race([YTP.whenReady(), sleep(8000).then(() => { throw new Error("t"); })]); }
  catch { throw new Error("YouTube 播放器還沒載入完成，請稍後再試。"); }
  YTP.plErr = 0; YTP.plWatch = true;
  YTP.call("cuePlaylist", { listType: "playlist", list: id });
  try {
    for (let n = 0; n < 50; n++) {
      await sleep(300);
      const ids = YTP.call("getPlaylist");
      if (ids && ids.length) return ids.filter((v, i) => /^[\w-]{11}$/.test(v) && ids.indexOf(v) === i);
      if (YTP.plErr === 100 && n > 4) break;
    }
  } finally { YTP.plWatch = false; YTP.stop(); }
  throw new Error(YTP.plErr === 100 ? "找不到這份播放清單，或是它設成私人。把清單的隱私權改成「不公開」或「公開」再試。" : "讀不到這份播放清單。自動產生的合輯（網址 list= 後面是 RD 開頭）不支援。");
}
/* Title lookup 1: noembed (fast, bulk). Title lookup 2: the standby player (slow, but needs no third party). */
async function titleViaNoembed(v){
  try {
    const d = await jsonp(`https://noembed.com/embed?url=${encodeURIComponent("https://www.youtube.com/watch?v=" + v)}`);
    return d && d.title ? { vt: d.title, ch: d.author_name || "" } : null;
  } catch { return null; }
}
async function titleViaPlayer(v){
  if (!YTP.ready) return null;
  const i = 1 - YTP.a;
  YTP.callOn(i, "mute"); YTP.callOn(i, "cueVideoById", v);
  for (let n = 0; n < 20; n++) {
    await sleep(150);
    const d = YTP.callOn(i, "getVideoData");
    if (d && d.video_id === v && d.title) return { vt: d.title, ch: d.author || "" };
  }
  return null;
}

function openImport(id){
  const ed = id ? MINE.find(l => l.id === id) : null;
  const text = ed ? ed.songs.map(s => [s.title, s.artist, "https://youtu.be/" + s.v].filter(Boolean).join(" | ")).join("\n") : "";
  openModal(`${mhead(ed ? "編輯題庫" : "貼上 YouTube 連結")}
    <div style="padding:24px 28px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px">
      <input class="field" id="impName" placeholder="題庫名稱，例如：大學同學 KTV" maxlength="24" value="${esc(ed ? ed.name : "")}">
      <textarea class="field" id="impText" placeholder="貼上播放清單網址，整份清單變成題庫：&#10;https://www.youtube.com/playlist?list=PL…&#10;&#10;或一行一支影片：&#10;https://www.youtube.com/watch?v=…&#10;https://youtu.be/…&#10;&#10;想自己寫歌名歌手也可以：&#10;小幸運 | 田馥甄 | https://youtu.be/…">${esc(text)}</textarea>
      <p style="margin:0;color:var(--mute);font-size:13px">沒寫歌名的話，會從影片標題自動猜，猜錯可以回來編輯。播放清單最多讀前 200 支，要是公開或不公開的清單。這份題庫只存在這台裝置。</p>
      <p class="msg" id="impMsg" role="status"></p>
    </div>
    <div class="mf"><span class="lbl"></span>${ed ? `<button class="btn danger" id="impDel">${icon("trash")}刪除</button>` : ""}<button class="btn" data-close>取消</button><button class="btn pri" id="impSave">${icon("check")}儲存</button></div>`, true);
  $("#impName").focus();
  if (ed) $("#impDel").onclick = () => { MINE = MINE.filter(l => l.id !== id); store.set("yt.lists", MINE); closeModal(); renderGrid(); toast("已刪除題庫"); };
  $("#impSave").onclick = async () => {
    const msg = $("#impMsg"), btn = $("#impSave");
    const lines = $("#impText").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const items = [], seen = new Set(), lists = []; let skipped = 0;
    lines.forEach(line => {
      const m = line.match(YT_ID), pl = line.match(YT_LIST);
      if (m) {
        if (seen.has(m[1])) return; seen.add(m[1]);
        const rest = line.split("|").map(s => s.trim()).filter(p => p && !YT_ID.test(p));
        items.push({ v: m[1], title: rest[0] || "", artist: rest[1] || "" });
      } else if (pl && /youtube\.com/.test(line)) lists.push(pl[1]);
      else skipped++;
    });
    if (!items.length && !lists.length) { msg.textContent = "沒有找到 YouTube 連結。播放清單的網址長得像 youtube.com/playlist?list=…"; return; }
    btn.disabled = true; msg.textContent = "";
    try {
      for (const lid of lists) {
        msg.textContent = "讀取播放清單…";
        const ids = await readPlaylist(lid);
        ids.forEach(v => { if (!seen.has(v)) { seen.add(v); items.push({ v, title: "", artist: "" }); } });
      }
    } catch (e) { msg.textContent = e.message; btn.disabled = false; return; }
    /* titles */
    const need = items.filter(s => !s.title), total = need.length; let done = 0;
    const meta = new Map();
    const worker = async () => { while (need.length) { const s = need.shift();
      const d = await titleViaNoembed(s.v); if (d) meta.set(s.v, d);
      msg.textContent = `讀取影片標題… ${++done}/${total}`; } };
    await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);
    const miss = items.filter(s => !s.title && !meta.has(s.v));
    for (let k = 0; k < miss.length; k++) {
      msg.textContent = `改用播放器讀取標題… ${k + 1}/${miss.length}`;
      const d = await titleViaPlayer(miss[k].v); if (d) meta.set(miss[k].v, d);
    }
    YTP.callOn(1 - YTP.a, "stopVideo");
    let unnamed = 0;
    items.forEach(s => {
      if (s.title) return;
      const d = meta.get(s.v);
      if (d) { s.vt = d.vt; s.ch = d.ch; const g = guessSong(d.vt, d.ch); s.title = g.title; s.artist = g.artist; }
      else { s.title = "影片 " + s.v; unnamed++; }
    });
    const name = $("#impName").value.trim() || (lists.length ? "我的播放清單" : "我的題庫");
    if (ed) { ed.name = name; ed.songs = items; }
