name: 更新歌單並發布網站

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "全部歌曲重新查詢"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 查詢歌曲
        run: node build-songs.js ${{ inputs.force && '--force' || '' }}

      - name: 存回查詢結果
        run: |
          if [ -n "$(git status --porcelain songs-data.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add songs-data.js
            git commit -m "更新歌曲資料"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
